name: 'GeoBrix native payload (x86_64)'
description: 'The x86_64 native build this run found or made, laid out as the payload a JVM loads its GDAL from.'
# Why: the JAR's GDAL Java classes are the native build's (pom.xml gdal.java.version), and GDALManager refuses any
# other JNI, so every CI job that runs a GeoBrix JVM runs on the native payload's GDAL, as the dev container does.
#
# The job must `needs:` a job that calls .github/workflows/build-gdal-native.yml, which finds the build in the cache
# or makes it. This action reads it: from the cache (the same key and paths as the builder's), else from this run's
# native-out-x86_64 artifact (the builder uploads it when it built, for a run that does not save the cache). Then
# scripts/native/jvm_payload.py lays out build/native/jvm-payload (_native/x86_64/lib with the JNI, _native/share),
# the env wheel's native layout, every file checked against MANIFEST.json's sha256. Pass the `root` output to
# .github/actions/scala_build (native_root), which links /usr/lib/libgdalalljni.so to that payload's JNI before the
# first test JVM. No Python bindings are laid out: the jobs' Python processes keep the GDAL they install.
outputs:
  root:
    description: 'The payload root (the GBX_NATIVE_ROOT layout): <root>/_native/x86_64/lib/libgdalalljni.so'
    value: ${{ steps.layout.outputs.root }}
runs:
  using: "composite"
  steps:
    # A failed hash must not become a constant key (native-out-x86_64-), which could restore a stale build: the value
    # is checked before it is written.
    - name: Hash the native build's inputs
      id: key
      shell: bash
      run: |
        set -euo pipefail
        [ "$(uname -m)" = x86_64 ] || { echo "::error::CI's native build is x86_64; this runner is $(uname -m)"; exit 1; }
        h=$(python3 scripts/native/native_inputs.py hash --set build)
        [[ $h =~ ^[0-9a-f]{64}$ ]] || { echo "::error::native_inputs.py hash --set build printed '$h', not a sha256"; exit 1; }
        echo "hash=$h" >> "$GITHUB_OUTPUT"

    - name: Restore the cached native build
      id: cache
      uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5.0.3
      with:
        path: |
          build/native/out/x86_64/stage-native
          build/native/out/x86_64/bindings
          !build/native/out/x86_64/**/*-debuginfo.tar.xz
        key: native-out-x86_64-${{ steps.key.outputs.hash }}

    - name: Download this run's native build
      if: steps.cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: native-out-x86_64
        path: build/native/out/x86_64

    - name: Lay out the JVM payload
      id: layout
      shell: bash
      env:
        HIT: ${{ steps.cache.outputs.cache-hit }}
        HASH: ${{ steps.key.outputs.hash }}
      run: |
        set -euo pipefail
        native=build/native/out/x86_64/stage-native/gdal-native
        if [ ! -f "$native/MANIFEST.json" ]; then
          echo "::error::no x86_64 native build: neither the cache entry native-out-x86_64-$HASH nor this run's native-out-x86_64 artifact. The job needs a job that calls .github/workflows/build-gdal-native.yml (cache: true), on the same runner group (a cache entry's version includes its compression)."
          exit 1
        fi
        echo "native build from: $([ "$HIT" = true ] && echo the cache || echo this run's artifact)"
        root="$GITHUB_WORKSPACE/build/native/jvm-payload"
        python3 scripts/native/jvm_payload.py --native "$native" --arch x86_64 --out "$root"
        echo "root=$root" >> "$GITHUB_OUTPUT"
