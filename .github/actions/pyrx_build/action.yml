name: build geobrix pyrx (lightweight)
description: >
  Build and test the lightweight, JAR-free raster API (pyrx). Unlike
  scala_build / python_build this installs NO Scala JAR and NO apt/native GDAL —
  pyrx runs on rasterio's bundled GDAL (the same path that works on Serverless,
  shared clusters, and ARM). It needs only a JVM (pyspark local mode) plus the
  pure-Python geobrix[pyrx] extra. Kept fast and isolated so it can gate the
  heavyweight build (fail-fast).
inputs:
  python_version:
    description: 'Python version (matches the job matrix).'
    default: '3.12.3'
  dirs:
    description: >
      Space-separated light test dirs (relative to python/geobrix) this job runs in one pytest
      process, e.g. 'test/pyrx'. The CI workflow shards the light tier across parallel jobs and
      gives each its share (see the `pyrx` job matrix in .github/workflows/build_main.yml).
      Empty runs every light dir in one process.
    default: ''
runs:
  using: "composite"
  steps:
    # pyspark local mode needs a JVM even though pyrx never builds/loads the JAR.
    - name: Configure JDK
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
      with:
        java-version: '17'
        distribution: 'zulu'
    # Pre-route pip at db-pypi BEFORE actions/setup-python runs (its bundled
    # "pip install --upgrade pip" otherwise hits the blocked pypi.org egress on
    # the hardened runner). Same pattern as scala_build / python_build.
    - name: Pre-bootstrap pip for JFrog (pre-setup-python)
      uses: ./.github/actions/jfrog-pip-bootstrap
    - name: Configure python interpreter
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        cache: 'pip'
        cache-dependency-path: '.ci-pip-cache-key'
        python-version: ${{ inputs.python_version }}
    - name: Authenticate for JFrog (pip via OIDC)
      id: jfrog
      uses: ./.github/actions/jfrog-auth
    # The Delta jar fetch below runs Maven; it uses the pinned ./mvnw like every other CI Maven call.
    - name: Install the pinned Maven (wrapper)
      uses: ./.github/actions/maven-wrapper
      with:
        jfrog-access-token: ${{ steps.jfrog.outputs.jfrog-access-token }}
    - name: Install pyrx deps (hash-pinned) + package
      shell: bash
      run: |
        # Bootstrap pip itself to a known version before --require-hashes.
        pip install --upgrade pip==25.0.1
        # Hash-pinned supply chain (matches requirements-ci.txt / dev-container
        # discipline; see docs/docs/security.mdx): every wheel is sha256-verified,
        # so a compromised mirror serving same-version-different-bytes fails closed.
        # Regenerate via (from python/geobrix/):
        #   uv pip compile --generate-hashes --python-version 3.12 \
        #       --output-file requirements-light-env6-ci.txt requirements-light-env6-ci.in
        # No GDAL exception here — rasterio's bundled-GDAL binary wheel is pinned
        # in the lock too (the lightweight API installs no native GDAL, no JAR).
        pip install --require-hashes -r python/geobrix/requirements-light-env6-ci.txt
        # Install the in-repo package itself with --no-deps; every dependency is
        # already in the hash-pinned closure above.
        pip install --no-deps python/geobrix
        python -c "import rasterio, pyarrow, pandas, shapely; print('rasterio', rasterio.__version__, 'gdal', rasterio.__gdal_version__, 'pyarrow', pyarrow.__version__, 'pandas', pandas.__version__)"
    # test/zarr runs the Zarr transactional manifest against a local Delta Lake session. PySpark
    # needs the OSS delta-spark jars on the JVM classpath, and they are not in the hash-pinned
    # pip lock. Fetch them with Maven, which jfrog-auth (above) already pointed at the JFrog
    # db-maven mirror. Spark's own `--packages` (Ivy) is not used: it ignores that mirror and
    # the hardened runner blocks direct Maven Central. test/conftest.py finds the jars in
    # ~/.m2/repository and puts them on PYSPARK_SUBMIT_ARGS when test/zarr is collected.
    - name: Fetch Delta Lake jars (Zarr manifest tests)
      shell: bash
      env:
        GBX_MVN: ./mvnw
      run: bash scripts/ci/fetch-delta-test-jars.sh
    - name: Build lightweight wheel
      shell: bash
      run: |
        cd python/geobrix
        python -m build
    - name: Run pyrx tests (no JAR)
      shell: bash
      env:
        SHARD_DIRS: ${{ inputs.dirs }}
      run: |
        cd python/geobrix
        # pyproject sets pythonpath=["src"]; exclude integration (network) tests.
        # test/ds = lightweight DataSource readers/writer + the tiled-output
        # framework (raster_gbx/gtiff_gbx/pmtiles_gbx); same light-dep set as pyrx.
        # The lightweight tier is exercised ONLY here (the heavy phase skips these
        # dirs via test/conftest.py collect_ignore). Every light test dir must be
        # listed: pyrx, ds, pyvx, pygx (light GridX), pmtiles_light (light
        # pmtiles_agg), zarr (transactional Zarr stores, [zarr_dbr19] extra; needs the Delta
        # jars fetched above), stac (light STAC client, [stac] extra),
        # vizx (gbx.vizx, [vizx] extra), sample (gbx.sample.overture, [overture] extra),
        # bench (bench-harness spec/compare/fingerprint/runner unit tests -- guards
        # the light bench FnSpec registry + cross-tier count invariants),
        # models (gbx.models GeoSAM/runner/serving -- torch/segment-geospatial/mlflow
        # are lazy-imported at function scope, so no [models] extra install is needed
        # here. No test in test/models is GPU-bound or marked `integration`: GeoSAM/
        # segmenter backends are monkeypatch-injected fakes (test_geosam.py,
        # test_runner.py), and the mlflow-dependent serving tests are individually
        # guarded with `pytest.importorskip("mlflow")` (test_serving.py) rather than
        # excluded via the `-m "not integration"` filter below).
        #
        # CI shards the light tier: each parallel job passes its dirs in `dirs`, and
        # scripts/ci/test_ci_light_shards.py fails unless the shards together cover exactly the dirs of
        # _LIGHT_TEST_DIRS in test/conftest.py, each once. A shard runs its dirs in ONE
        # process, so state one dir leaves behind reaches the next: test/pyvx registers PROJ
        # grids before test/bench builds rasters on worker threads (see test/conftest.py for
        # the maintained condition), so those two stay in one shard, pyvx first.
        if [ -n "$SHARD_DIRS" ]; then
          pytest $SHARD_DIRS -m "not integration" -v
        else
          # No shard given: every light dir in one process. gbx:test:python and gbx:test:light
          # read this line, so keep it a plain `pytest test/... -m ...` and in step with the shards.
          pytest test/pyrx test/ds test/pyvx test/pygx test/pmtiles_light test/stac test/earthdata test/vizx test/sample test/bench test/core test/models test/zarr -m "not integration" -v
        fi
