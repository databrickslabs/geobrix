# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    # Labs lockdown policy: wait 7 days after a release before opening a PR
    # (reduces exposure to supply-chain attacks that rely on fast-propagating new versions).
    cooldown:
      default-days: 7
    # One PR for the build plugins: a plugin bump usually pulls newly signed transitive
    # artifacts, so .maven-keys.list (pgpverify) is fixed once for the whole group.
    groups:
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:*"
    # Spark is a `provided` dependency compiled against the lowest supported runtime's Spark
    # (DBR 17.3, Spark 4.0), so one JAR loads on DBR 17.3, 18 and 19. A newer Spark is checked
    # by running the JAR on that runtime, not by compiling against it.
    # jackson-databind is `provided` and must equal the Spark build's own jackson version
    # (2.18.2 for Spark 4.0.0), so it follows Spark, not the latest release. `jackson.version`
    # in pom.xml is overridden for a compat build against another Spark.
    ignore:
      - dependency-name: "org.apache.spark:*"
      - dependency-name: "com.fasterxml.jackson*"

  - package-ecosystem: "pip"
    directory: "/python/geobrix"
    schedule:
      interval: "weekly"
    # Raise a floor only when the new release is needed to keep the current
    # constraint resolvable. Without this, Dependabot bumps every `>=` floor in
    # pyproject.toml to the latest release, which forces package moves on
    # runtimes that preinstall an older version (the per-runtime base packages).
    versioning-strategy: increase-if-necessary
    # Labs lockdown policy: wait 7 days after a release before opening a PR
    # (reduces exposure to supply-chain attacks that rely on fast-propagating new versions).
    cooldown:
      default-days: 7
    # pyproject.toml is an input of the two-architecture native gate, so any pin edit
    # there forces a restamp. The lint toolchain (pinned to match requirements-ci.in and
    # the dev-container locks) and the vizx anywidget range are bumped by hand together
    # with the next real pyproject.toml change (any bump, a patch too, edits the file).
    ignore:
      - dependency-name: "isort"
      - dependency-name: "black"
      - dependency-name: "flake8"
      - dependency-name: "flake8-pyproject"
      - dependency-name: "anywidget"

  # NOTE: No `github-actions` ecosystem entry: the lockdown policy disables
  # Dependabot updates for Actions so SHA pins are not silently bumped.
  # Action SHAs are refreshed manually via `scripts/security/pin-gh-actions`.
