name: build main
# Runs on: push to any branch (except python/** and scala/**), all PRs, and manual trigger.
# Scala doc tests are excluded from the main Scala run; they run in a separate step only on push to main.
# Manual run: Actions → "build main" → Run workflow (workflow_dispatch).
#
# All jobs run on the Databricks-hardened runner group (Labs lockdown policy).
# This workflow does not interpolate any github.event.* values into run: blocks.
on:
  push:
    branches-ignore:
      - "python/**"
      - "scala/**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  # Regenerate doc-snippet-inventory and push to the PR branch (not main). Only for PRs targeting main.
  update-doc-inventory:
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    # Scoped to protected env so REPO_ACCESS_TOKEN is only available to approved workflow runs.
    environment: runtime
    permissions:
      # Needed to push the regenerated inventory back onto the PR head branch.
      contents: write
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}
      - name: Rebuild doc-snippet-inventory
        run: python3 scripts/ci/inventory-doc-snippets.py
      - name: Commit and push if inventory changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/doc-snippet-inventory.json
          git diff --staged --quiet && echo "No changes to doc-snippet-inventory.json" && exit 0
          git commit -m "chore(docs): rebuild doc-snippet-inventory.json [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
  # The x86_64 native build the heavy build's JVMs load their GDAL from (the JAR's GDAL Java classes refuse any
  # other JNI) and the light shards' bindings come from. Cached on the native build's inputs: a hit takes seconds, a
  # miss builds (about 20-40 min). See .github/workflows/build-gdal-native.yml for the cache rules.
  native-payload:
    uses: ./.github/workflows/build-gdal-native.yml
    with:
      cache: true
    permissions:
      contents: read
      # Required by .github/actions/jfrog-auth (on a cache miss): GitHub OIDC token exchange for pip and crates via JFrog.
      id-token: write

  # The native payload the light shards test on, built once: GDAL's own Python bindings (osgeo), the five vendored
  # bindings (rasterio, pyogrio, pyproj, shapely, netCDF4) and the Rust module (rust/gbxrs), laid out as the env wheel
  # carries them (scripts/ci/light_native.py), from the native build `native-payload` found or made. Every light shard
  # downloads it as one artifact (a tarball: the layout has a symlink and an executable) and refuses to test unless the
  # bindings and the Rust module load from it. Runs on the runner group of `native-payload`: the cache entry it reads
  # is restorable only there (a cache entry's version includes its compression).
  light-payload:
    name: Native payload for the light tests (x86_64)
    needs: native-payload
    runs-on:
      group: larger-runners
      labels: larger
    environment: runtime
    permissions:
      contents: read
      # Required by .github/actions/jfrog-auth (the Rust crates come through JFrog on a cache miss).
      id-token: write
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      # build/native/jvm-payload: _native/x86_64/{lib,share,...}, every file checked against the build's MANIFEST.json.
      - name: Fetch the x86_64 native payload
        id: native
        uses: ./.github/actions/native_payload
      # The Rust module is not part of the native build: it is a small pure-Rust crate (pyo3 only, no GDAL), built here
      # with the pinned toolchain (rust-toolchain.toml) and cached on its sources, so a change to the crate, its lock or
      # the toolchain is a new key. The shipped module is built in the manylinux container (gbx:build:rs); this one runs
      # on the runner that built it.
      - name: Restore the Rust module
        id: rs
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5.0.3
        with:
          path: build/rs-ci/_gbxrs.so
          key: gbxrs-x86_64-${{ hashFiles('rust/gbxrs/Cargo.toml', 'rust/gbxrs/Cargo.lock', 'rust/gbxrs/src/**', 'rust-toolchain.toml') }}
      - name: Authenticate for JFrog (crates via OIDC)
        id: jfrog
        if: steps.rs.outputs.cache-hit != 'true'
        uses: ./.github/actions/jfrog-auth
      - name: Configure Cargo for JFrog
        if: steps.rs.outputs.cache-hit != 'true'
        uses: ./.github/actions/jfrog-cargo
        with:
          jfrog-access-token: ${{ steps.jfrog.outputs.jfrog-access-token }}
      - name: Build the Rust module
        if: steps.rs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          bash scripts/native/install-host-rust.sh
          export RUSTUP_HOME="$HOME/.cache/geobrix/rustup" CARGO_HOME="$GBX_HOST_CARGO_HOME"
          export PATH="$CARGO_HOME/bin:$PATH"
          (cd rust/gbxrs && cargo build --release --locked)
          mkdir -p build/rs-ci
          cp rust/gbxrs/target/release/lib_gbxrs.so build/rs-ci/_gbxrs.so
      - name: Save the Rust module
        if: steps.rs.outputs.cache-hit != 'true'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5.0.3
        with:
          path: build/rs-ci/_gbxrs.so
          key: gbxrs-x86_64-${{ hashFiles('rust/gbxrs/Cargo.toml', 'rust/gbxrs/Cargo.lock', 'rust/gbxrs/src/**', 'rust-toolchain.toml') }}
      - name: Lay out the light payload
        run: |
          set -euo pipefail
          python3 scripts/ci/light_native.py assemble --native-out build/native/out/x86_64 \
            --jvm-payload "${{ steps.native.outputs.root }}" --rs build/rs-ci/_gbxrs.so --out build/native/light-payload
          mkdir -p build/native/light-payload-tar
          tar -czf build/native/light-payload-tar/light-payload.tar.gz -C build/native/light-payload .
          du -sh build/native/light-payload-tar/light-payload.tar.gz
      - name: Hand the payload to the light shards
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: light-native-payload
          path: build/native/light-payload-tar/light-payload.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # The lightweight, JAR-free tier (pyrx and the other light dirs), always on the native bindings and the Rust module
  # (see `light-payload`): no Scala JAR, no apt/native GDAL, just the payload and pyspark local. Runs in parallel with the
  # heavy build; neither waits for the other.
  #
  # Sharded so that no shard's pytest runs much past ~15 min: the `shard` matrix gives each job its test paths. A
  # shard is a set of paths, or a hashed part of a dir (`part`: test/pyrx, test/zarr), or the oracle tables of the one
  # file test_family_cross_tier.py (`oracle_tables`). scripts/ci/test_ci_light_shards.py fails unless the shards
  # together run every test file of the light dirs of python/geobrix/test/conftest.py (_LIGHT_TEST_DIRS) exactly once
  # (that file once per oracle table), and the heavy build's LIGHT_IGNORES lists the same dirs. A new light dir, file or
  # oracle table goes into ONE shard here. Every shard always runs; there is no matrix exclude/include and no path filter, so a
  # red test at HEAD can never be hidden (the guard checks that as well).
  light:
    name: Light tests - ${{ matrix.shard.name }} (py${{ matrix.python }})
    needs: light-payload
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest
    # Checkout uses REPO_ACCESS_TOKEN (non-exempt secret); jfrog-auth uses OIDC.
    environment: runtime
    permissions:
      contents: read
      # Required by .github/actions/jfrog-{auth,pip-bootstrap}: OIDC token exchange for pip via JFrog.
      id-token: write
    strategy:
      # Let every shard finish so one push reports all the failing shards, not just the first.
      fail-fast: false
      matrix:
        python: [ 3.12.3 ]
        shard:
          # test/pyrx, the longest dir (~17 min), in two hashed halves.
          - name: pyrx 1/2
            paths: test/pyrx
            part: 0/2
          - name: pyrx 2/2
            paths: test/pyrx
            part: 1/2
          - name: ds
            paths: test/ds
            delta: true
          # test/zarr (~34 min, on the Delta jars) in four hashed parts (its two longest files, test_write and
          # test_maint, land in different ones).
          - name: zarr 1/4
            paths: test/zarr
            part: 0/4
            delta: true
          - name: zarr 2/4
            paths: test/zarr
            part: 1/4
            delta: true
          - name: zarr 3/4
            paths: test/zarr
            part: 2/4
            delta: true
          - name: zarr 4/4
            paths: test/zarr
            part: 3/4
            delta: true
          # The family oracle tables of test/manager (~27 min) in three: every oracle table of the manifest in exactly one.
          - name: manager family 1/3
            paths: test/manager/test_family_cross_tier.py
            oracle_tables: CELL_AGGREGATE,GRID_GENERATOR,MVP_G,MVP_S,RASTER_ARRAY_OP,RASTER_TO_GRID,RASTER_VECTORIZE,SPEC_ANALYSIS,SPEC_WARP,WEB_TILES
          - name: manager family 2/3
            paths: test/manager/test_family_cross_tier.py
            oracle_tables: DRIVERS,GRID_ARRAY,MVP_H,RASTER_ACCESSOR,RASTER_GENERATOR,RASTER_RASTERIZE,SPEC_DEM,VECTOR_GENERATOR,VECTOR_SCALAR
          - name: manager family 3/3
            paths: test/manager/test_family_cross_tier.py
            oracle_tables: GRID_SCALAR,RASTER_AGGREGATE,RASTER_CONSTRUCTOR,RASTER_FILE_OP,RASTER_STAT,RASTER_TILE_OP,SPEC_CALC,SPEC_GDAL,SPEC_SE,VECTOR_AGGREGATE
          - name: manager
            paths: test/manager
            ignore: test/manager/test_family_cross_tier.py
          # test/bench in three: test_levels.py was ~15 min on its own (the critical path), so its test_levels_leg_*
          # tests are test_levels_legs.py; test_levels.py keeps its worker-peak tests and its remainder and runs with
          # test/pyvx (~1 min). test_levels_family_forms.py (~5.5 min) joins test_levels_legs.py (~3.5 min), so the
          # second and third shards are ~9 min each; the third is the rest of the dir. A hashed split would put the long
          # parts together. Each shard is self-sufficient: bench needs nothing a previous test dir left in the process.
          - name: bench 1/3
            paths: test/pyvx test/bench/test_levels.py
          - name: bench 2/3
            paths: test/bench/test_levels_legs.py test/bench/test_levels_family_forms.py
          - name: bench 3/3
            paths: test/bench
            ignore: test/bench/test_levels.py test/bench/test_levels_legs.py test/bench/test_levels_family_forms.py
          # test/engine (~12.5 min; test_engine_leaks.py alone ~9) on its own: with the other dirs it was ~22 min, the
          # light job's critical path.
          - name: engine
            paths: test/engine
          - name: other dirs
            paths: test/pygx test/pmtiles_light test/stac test/earthdata test/vizx test/sample test/core test/models test/drivers_extended
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: set up the light environment and test (lightweight)
        uses: ./.github/actions/pyrx_build
        with:
          python_version: ${{ matrix.python }}
          paths: ${{ matrix.shard.paths }}
          ignore: ${{ matrix.shard.ignore }}
          part: ${{ matrix.shard.part }}
          oracle_tables: ${{ matrix.shard.oracle_tables }}
          delta: ${{ matrix.shard.delta || 'false' }}

  # The tests of the scripts themselves: the JAR packaging check, the gbx:dcs:build / gbx:dcs:publish gates, the CI shard
  # guard. Stdlib + pytest (from the light install); the DCS commands run against a fake docker on PATH, so no Docker
  # daemon or registry is involved. It is a light-environment job without a native payload (it tests no light code).
  light-scripts:
    name: Script tests (scripts/ci)
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest
    environment: runtime
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: set up the light environment
        uses: ./.github/actions/pyrx_build
        with:
          python_version: 3.12.3
          native: 'false'
          run_tests: 'false'
      - name: test scripts/ci (JAR packaging check, DCS build/publish gates, shard guard)
        # The install-moves rows (test_build_env_wheel.py) resolve with uv. uv comes through the job's pip, which the
        # JFrog bootstrap routes to the mirror (never a direct download), and uses the same index and netrc; the rows
        # FAIL in CI (CI=true) when uv or the index is missing, they do not skip.
        # The index comes from the pip.conf the JFrog bootstrap wrote ($PIP_CONFIG_FILE). `pip config get` does not
        # read that file ("No such key"), which left UV_DEFAULT_INDEX empty, so uv went to pypi.org, which the hardened
        # runner blocks ("tls handshake eof"). An empty index now fails the step instead. The file is read raw: a
        # percent-encoded credential in the URL (%40) is no interpolation.
        run: |
          python -m pip install --quiet uv==0.13.5
          index="$(python -c 'import configparser, os; c = configparser.RawConfigParser(); c.read(os.environ["PIP_CONFIG_FILE"]); print(c.get("global", "index-url", fallback=""))')"
          if [ -z "$index" ]; then echo "::error::no index-url in PIP_CONFIG_FILE; uv would fall back to pypi.org"; exit 1; fi
          UV_DEFAULT_INDEX="$index" python -m pytest scripts/ci -v

  # CI is x86_64 only; the aarch64 native build is checked by the local two-architecture gate
  # (bash scripts/commands/gbx-native-verify-arches.sh), whose stamp scripts/native/arch-gate.json names the native
  # inputs it checked. This fails when they changed since: run the gate and commit the stamp. Builds nothing.
  arch-gate:
    name: Two-architecture native gate is current
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Check scripts/native/arch-gate.json against the native inputs
        run: python3 scripts/native/native_inputs.py check-stamp

  build:
    name: Heavy tests (Scala + JAR)
    # Heavy: full Scala test + Python test+coverage + GDAL native install (mvn -T 1C, ~10–15 min). Standard runner is too small.
    # Needs only the native payload: it runs in parallel with the light shards (they share no state), so the run takes as
    # long as the slower of the two, and a red light shard no longer hides the heavy result (nor the reverse).
    needs: native-payload
    runs-on:
      group: larger-runners
      labels: larger
    # Checkout uses REPO_ACCESS_TOKEN (non-exempt secret), so gate behind the protected env.
    environment: runtime
    permissions:
      contents: read
      # Required by .github/actions/jfrog-auth: GitHub OIDC token exchange for pip/Maven via JFrog.
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # The shared scala_build / python_build actions read matrix.python and matrix.gdal (and scripts/native/legacy-consumers.txt
    # audits the gdal line), so those two stay a matrix; the explicit name above keeps them out of the job's title.
    strategy:
      matrix:
        python: [ 3.12.3 ]
        gdal: [ 3.11.4 ]
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Create pip cache key file
        run: |
          echo "${{ github.ref }}-${{ matrix.python }}-numpy2.1.3-spark4.0.0-${{ matrix.gdal }}" > .ci-pip-cache-key
      - name: Cache apt packages
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5.0.3
        with:
          path: .cache/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/actions/scala_build/action.yml', '.github/actions/python_build/action.yml') }}
      # The native-payload job's build (from the cache, else this run's artifact), laid out for the JVMs.
      - name: Fetch the x86_64 native payload
        id: native
        uses: ./.github/actions/native_payload
      - name: build scala
        uses: ./.github/actions/scala_build
        with:
          # Disable scoverage in main build to keep CI ~10–15 min (full Scala coverage is ~30+ min). Run coverage locally via the gbx:coverage:* commands.
          enable_coverage: "false"
          fail_on_scalastyle: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
          native_root: ${{ steps.native.outputs.root }}
      - name: build python
        uses: ./.github/actions/python_build
        with:
          run_lint: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
          enable_coverage: "true"
      - name: Rebuild doc-snippet-inventory
        run: python3 scripts/ci/inventory-doc-snippets.py
      # Disabled until project launch. Re-enable by restoring the condition below.
      - name: Scala doc tests (main only, after everything else)
        if: false  # Disabled until project launch
        env:
          GBX_SAMPLE_DATA_ROOT: ${{ runner.temp }}/geobrix-sample-data
        run: |
          mkdir -p "$GBX_SAMPLE_DATA_ROOT"
          sudo -E ./mvnw -C -q test -Dsuites='tests.docs.scala.*,docs.tests.scala.*' -DfailIfNoTests=false -Dscoverage.skip
      - name: upload artifacts
        uses: ./.github/actions/upload_artifacts

