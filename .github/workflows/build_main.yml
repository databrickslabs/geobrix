name: build main
# Runs on: push to any branch (except python/** and scala/**), all PRs, and manual trigger.
# Scala doc tests are excluded from the main Scala run; they run in a separate step only on push to main.
# Manual run: Actions → "build main" → Run workflow (workflow_dispatch).
#
# All jobs run on the Databricks-hardened runner group (Labs lockdown policy).
# This workflow does not interpolate any github.event.* values into run: blocks.
on:
  push:
    branches-ignore:
      - "python/**"
      - "scala/**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  # Regenerate doc-snippet-inventory and push to the PR branch (not main). Only for PRs targeting main.
  update-doc-inventory:
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    # Scoped to protected env so REPO_ACCESS_TOKEN is only available to approved workflow runs.
    environment: runtime
    permissions:
      # Needed to push the regenerated inventory back onto the PR head branch.
      contents: write
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}
      - name: Rebuild doc-snippet-inventory
        run: python3 scripts/ci/inventory-doc-snippets.py
      - name: Commit and push if inventory changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/doc-snippet-inventory.json
          git diff --staged --quiet && echo "No changes to doc-snippet-inventory.json" && exit 0
          git commit -m "chore(docs): rebuild doc-snippet-inventory.json [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
  # Lightweight, JAR-free raster API (pyrx). Runs FIRST and gates the heavy
  # build below (fail-fast): no Scala JAR, no apt/native GDAL — just rasterio's
  # bundled GDAL + pyspark local.
  #
  # Sharded: the light test dirs run as parallel jobs (the `shard` matrix), each in one pytest
  # process, instead of one ~1 h process. `build` needs this job, so it starts only after ALL
  # shards pass. scripts/ci/test_ci_light_shards.py fails unless the shards together hold exactly
  # the light dirs of python/geobrix/test/conftest.py (_LIGHT_TEST_DIRS), each once, and the
  # heavy build's LIGHT_IGNORES lists the same set. A new light dir goes into ONE shard here.
  # Keep pyvx before bench in one shard: pyvx leaves the PROJ grids bench relies on (the guard
  # checks that too). Every shard always runs; there is no matrix exclude/include and no path
  # filter, so a red test/bench at HEAD can never be hidden (the guard checks that as well).
  pyrx:
    name: Lightweight (pyrx) tests - ${{ matrix.shard.name }} (${{ matrix.python }})
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest
    # Checkout uses REPO_ACCESS_TOKEN (non-exempt secret); jfrog-auth uses OIDC.
    environment: runtime
    permissions:
      contents: read
      # Required by .github/actions/jfrog-{auth,pip-bootstrap}: OIDC token exchange for pip via JFrog.
      id-token: write
    strategy:
      # Let every shard finish so one push reports all the failing shards, not just the first.
      fail-fast: false
      matrix:
        python: [ 3.12.3 ]
        shard:
          - name: pyrx
            dirs: test/pyrx
          # Also runs the tests of the scripts themselves (one of the shorter shards).
          - name: ds
            dirs: test/ds
            scripts_ci: true
          # Its own shard: the Zarr tests are the longest dir after pyrx (Delta jars on the classpath).
          - name: zarr
            dirs: test/zarr
          - name: rest
            dirs: >-
              test/pyvx test/pygx test/pmtiles_light test/stac test/earthdata test/vizx
              test/sample test/bench test/core test/models test/manager test/engine
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Create pip cache key file
        run: echo "pyrx-${{ github.ref }}-${{ matrix.python }}" > .ci-pip-cache-key
      - name: build + test pyrx (lightweight)
        uses: ./.github/actions/pyrx_build
        with:
          python_version: ${{ matrix.python }}
          dirs: ${{ matrix.shard.dirs }}
      # Tests of the scripts themselves: the JAR packaging check, the gbx:dcs:build /
      # gbx:dcs:publish gates and the CI shard guard. Stdlib + pytest (from the pyrx install
      # above); the DCS commands run against a fake docker on PATH, so no Docker daemon or
      # registry is involved. Run once, in one shard.
      - name: test scripts/ci (JAR packaging check, DCS build/publish gates, shard guard)
        if: matrix.shard.scripts_ci
        run: python -m pytest scripts/ci -v

  # The x86_64 native build the heavy build's JVMs load their GDAL from (the JAR's GDAL Java classes refuse any
  # other JNI). Cached on the native build's inputs: a hit takes seconds, a miss builds (about 20-40 min), in
  # parallel with the pyrx shards. See .github/workflows/build-gdal-native.yml for the cache rules.
  native-payload:
    uses: ./.github/workflows/build-gdal-native.yml
    with:
      cache: true
    permissions:
      contents: read
      # Required by .github/actions/jfrog-auth (on a cache miss): GitHub OIDC token exchange for pip and crates via JFrog.
      id-token: write

  build:
    # Heavy: full Scala test + Python test+coverage + GDAL native install (mvn -T 1C, ~10–15 min). Standard runner is too small.
    # Gated on the lightweight pyrx job so a pyrx failure fails the run fast,
    # before spending ~10–15 min on the Scala/native build.
    needs: [pyrx, native-payload]
    runs-on:
      group: larger-runners
      labels: larger
    # Checkout uses REPO_ACCESS_TOKEN (non-exempt secret), so gate behind the protected env.
    environment: runtime
    permissions:
      contents: read
      # Required by .github/actions/jfrog-auth: GitHub OIDC token exchange for pip/Maven via JFrog.
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        python: [ 3.12.3 ]
        pytest: [9.1.1]
        numpy: [ 2.1.3 ]
        gdal: [ 3.11.4 ]
        spark: [ 4.0.0 ]
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Create pip cache key file
        run: |
          echo "${{ github.ref }}-${{ matrix.python }}-${{ matrix.numpy }}-${{ matrix.spark }}-${{ matrix.gdal }}" > .ci-pip-cache-key
      - name: Cache apt packages
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5.0.3
        with:
          path: .cache/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/actions/scala_build/action.yml', '.github/actions/python_build/action.yml') }}
      # The native-payload job's build (from the cache, else this run's artifact), laid out for the JVMs.
      - name: Fetch the x86_64 native payload
        id: native
        uses: ./.github/actions/native_payload
      - name: build scala
        uses: ./.github/actions/scala_build
        with:
          # Disable scoverage in main build to keep CI ~10–15 min (full Scala coverage is ~30+ min). Run coverage locally via the gbx:coverage:* commands.
          enable_coverage: "false"
          fail_on_scalastyle: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
          native_root: ${{ steps.native.outputs.root }}
      - name: build python
        uses: ./.github/actions/python_build
        with:
          run_lint: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
          enable_coverage: "true"
      - name: Rebuild doc-snippet-inventory
        run: python3 scripts/ci/inventory-doc-snippets.py
      - name: Check binding parity
        run: python3 docs/scripts/check-binding-parity.py
      # Disabled until project launch. Re-enable by restoring the condition below.
      - name: Scala doc tests (main only, after everything else)
        if: false  # Disabled until project launch
        env:
          GBX_SAMPLE_DATA_ROOT: ${{ runner.temp }}/geobrix-sample-data
        run: |
          mkdir -p "$GBX_SAMPLE_DATA_ROOT"
          sudo -E ./mvnw -C -q test -Dsuites='tests.docs.scala.*,docs.tests.scala.*' -DfailIfNoTests=false -Dscoverage.skip
      - name: upload artifacts
        uses: ./.github/actions/upload_artifacts

