name: package geobrix artifacts
# Release packaging: builds the JAR inline and the docs zip, and attaches every release artifact this workflow
# can build (JAR, DCS image Dockerfile, docs zip) to an existing tag via `gh release upload --clobber`.
#
# THE ENV WHEELS ARE NOT BUILT HERE. The wheels users install are geobrix-<version>+env5-py3-none-any.whl and
# geobrix-<version>+env6-py3-none-any.whl (docs/docs/installation.mdx tells users to download +env6 from the GitHub
# release). Each carries BOTH architectures' native payload (gdal-native and the five bindings, aarch64 and x86_64),
# and this repository's CI builds the native stack on x86_64 only (build-gdal-native.yml, a cache and a 1-day artifact
# for the CI JVMs): no workflow produces the aarch64 payload. The wheel build also runs auditwheel and the install check
# in each architecture's toolchain image, the aarch64 one natively. So the release owner builds and attaches the env
# wheels from an Apple Silicon machine (both architectures' trees from gbx:build:native), after this workflow ran.
# The plain wheel (python/geobrix/pyproject.toml) is the development loop's editable install, not a release asset, so
# this workflow neither builds nor attaches it.
#
# Manual-only: Actions -> "package geobrix artifacts" -> Run workflow.
#
# Inputs:
#   ref           - git ref to build from (branch / tag / SHA). Empty = the
#                   ref the workflow was launched on.
#   attach_to_tag - tag (e.g. v0.3.0) to attach all three files to. Empty =
#                   produce workflow artifacts only, no tag mutation.
#
# Always uploaded as workflow artifacts (downloadable from the run page):
#   1. geobrix-<version>-jar-with-dependencies.jar              (built inline)
#   2. geobrix-docs-<version>.zip                               (built inline from docs/)
#   3. scripts/docker/dcs/Dockerfile                            (committed; the DCS image recipe;
#                                                                attached to the tag as geobrix-<version>-dcs.Dockerfile)
#
# The release owner's steps for the env wheels, after this workflow ran with attach_to_tag set
# (`gh auth switch --user mjohns-databricks` first; gbx:build:native --arch both has built both architectures'
# stage-native and bindings trees from the release commit; scripts/commands/gbx-build-wheel.md has the details):
#   git checkout v<version>                                     # a clean tree: the wheel records GIT_SHA
#   (a release that ships the Rust module: gbx-build-rs.sh --arch both first, and --extra-payload build/rs/payload below)
#   gh run download <run id> -n geobrix-release-artifacts -D /tmp/gbx-release   # the JAR built by this run
#   bash scripts/commands/gbx-build-wheel.sh --env 5 --jar /tmp/gbx-release/target/geobrix-<version>-jar-with-dependencies.jar
#   bash scripts/commands/gbx-build-wheel.sh --env 6 --jar /tmp/gbx-release/target/geobrix-<version>-jar-with-dependencies.jar
#   bash scripts/commands/gbx-build-wheel.sh --env 5 --verify both
#   bash scripts/commands/gbx-build-wheel.sh --env 6 --verify both
#   gh release upload v<version> \
#       dist/env5/geobrix-<version>+env5-py3-none-any.whl \
#       dist/env6/geobrix-<version>+env6-py3-none-any.whl
#
# Security: every workflow_dispatch input is surfaced as env: before any
# run: block. Direct ${{ ... }} interpolation of user inputs into shell is
# a command-injection risk - we don't do it. See:
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
#
# All jobs run on the Databricks-hardened runner group (Labs lockdown policy).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch / tag / SHA) to build from. Empty = the ref the workflow was launched on."
        required: false
        type: string
        default: ""
      attach_to_tag:
        description: "Tag to attach the three files to (e.g. v0.3.0). Empty = workflow artifacts only."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  package:
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest
    environment: runtime
    permissions:
      contents: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_REF: ${{ inputs.ref }}
      INPUT_ATTACH_TO_TAG: ${{ inputs.attach_to_tag }}
    strategy:
      matrix:
        python: [ 3.12.3 ]
        numpy:  [ 2.1.3 ]
        spark:  [ 4.0.0 ]
    steps:
      - name: checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          java-version: "17"
          distribution: "zulu"
          cache: "maven"
          cache-dependency-path: "pom.xml"

      - name: Set Maven opts
        shell: bash
        run: echo "MAVEN_OPTS=-Xmx4g -XX:+UseG1GC" >> "$GITHUB_ENV"

      - name: Create pip cache key file
        shell: bash
        env:
          GH_REF: ${{ github.ref }}
          PY: ${{ matrix.python }}
          NP: ${{ matrix.numpy }}
          SP: ${{ matrix.spark }}
        run: |
          echo "${GH_REF}-${PY}-${NP}-${SP}" > .ci-pip-cache-key

      - name: Pre-bootstrap pip for JFrog
        uses: ./.github/actions/jfrog-pip-bootstrap

      - name: Configure Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          cache: "pip"
          cache-dependency-path: ".ci-pip-cache-key"
          python-version: ${{ matrix.python }}

      - name: Authenticate for JFrog
        id: jfrog
        uses: ./.github/actions/jfrog-auth

      - name: Install the pinned Maven (wrapper)
        uses: ./.github/actions/maven-wrapper
        with:
          jfrog-access-token: ${{ steps.jfrog.outputs.jfrog-access-token }}

      # GDAL's Java classes come from the GeoBrix native build (scripts/native/maven), in no repository: install them
      # sha256-checked against their pin and with no Maven plugin, before the PGP gate resolves anything.
      - name: Install GDAL's Java classes from the native build
        shell: bash
        run: python3 scripts/native/java_jar.py install

      - name: Verify Maven dependency PGP signatures
        shell: bash
        run: ./scripts/security/maven-pgp-verify

      - name: build scala JAR (skip tests, no GDAL install)
        shell: bash
        run: |
          ./mvnw -C -q clean package -DskipTests -Dscoverage.skip -Dscalastyle.fail=false
          ls -lh target/geobrix-*-jar-with-dependencies.jar
          python3 scripts/ci/check_jar_packaging.py target/geobrix-*-jar-with-dependencies.jar

      # ---- docs ----------------------------------------------------------
      # Docusaurus static-zip build, version-named from the JAR we just
      # produced. This replaces the previously-committed
      # resources/static/geobrix-docs-*.zip — the doc bundle is now a
      # release-time output, since release IS the natural time to cut a
      # static docs snapshot.
      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      # JFrog auth ran earlier; that step writes npm credentials too (per
      # deploy-docs.yml's pattern), so `npm ci` below will route through
      # the JFrog mirror.
      - name: Install docs dependencies
        shell: bash
        run: cd docs && npm ci

      - name: Build static docs zip
        shell: bash
        run: |
          set -euo pipefail
          # Parse version up front so we can name the zip — the repackage
          # step below also derives it, but doing it here too lets us name
          # the docs zip in a single shell invocation.
          JAR=$(ls target/geobrix-*-jar-with-dependencies.jar 2>/dev/null | head -1)
          VERSION=$(basename "$JAR" | sed -nE 's/^geobrix-(.+)-jar-with-dependencies\.jar$/\1/p')
          if [ -z "$VERSION" ]; then
              echo "could not parse version from JAR name: $(basename "$JAR")" >&2
              exit 1
          fi

          ( cd docs && npm run build:static-zip )

          mkdir -p dist
          DOCS_ZIP="dist/geobrix-docs-${VERSION}.zip"
          # Strip DS_Store noise; -q to keep run log readable.
          ( cd docs/build-static-zip && zip -qr "../../$DOCS_ZIP" . -x "*.DS_Store" )

          echo "GBX_DOCS_ZIP=$DOCS_ZIP" >> "$GITHUB_ENV"
          ls -lh "$DOCS_ZIP"

      - name: read the release version from the JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(ls target/geobrix-*-jar-with-dependencies.jar 2>/dev/null | head -1)
          if [ -z "$JAR" ]; then
              echo "no geobrix-*-jar-with-dependencies.jar found in target/" >&2
              exit 1
          fi
          VERSION=$(basename "$JAR" | sed -nE 's/^geobrix-(.+)-jar-with-dependencies\.jar$/\1/p')
          if [ -z "$VERSION" ]; then
              echo "could not parse version from JAR name: $(basename "$JAR")" >&2
              exit 1
          fi
          echo "GeoBrix version: $VERSION"
          echo "GBX_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: show release manifest
        shell: bash
        run: |
          echo "=== files to publish ==="
          ls -lh \
              "target/geobrix-${GBX_VERSION}-jar-with-dependencies.jar" \
              scripts/docker/dcs/Dockerfile \
              "${GBX_DOCS_ZIP}"

      - name: upload as workflow artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: geobrix-release-artifacts
          path: |
            target/geobrix-*-jar-with-dependencies.jar
            scripts/docker/dcs/Dockerfile
            dist/geobrix-docs-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: attach to tag
        if: ${{ inputs.attach_to_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$INPUT_ATTACH_TO_TAG" in
              v[0-9]*|[0-9]*) : ;;
              *)
                  echo "attach_to_tag '$INPUT_ATTACH_TO_TAG' doesn't look like a version tag." >&2
                  exit 1
                  ;;
          esac

          JAR=$(ls target/geobrix-*-jar-with-dependencies.jar | head -1)

          VERSION=$(basename "$JAR" | sed -nE 's/^geobrix-(.+)-jar-with-dependencies\.jar$/\1/p')
          if [ -z "$VERSION" ]; then
              echo "could not parse version from JAR name: $(basename "$JAR")" >&2
              exit 1
          fi
          cp scripts/docker/dcs/Dockerfile "dist/geobrix-${VERSION}-dcs.Dockerfile"

          gh release upload "$INPUT_ATTACH_TO_TAG" \
              "$JAR" \
              "dist/geobrix-${VERSION}-dcs.Dockerfile" \
              "${GBX_DOCS_ZIP}" \
              --clobber

          echo "Attached to tag $INPUT_ATTACH_TO_TAG:"
          echo "  $(basename "$JAR")"
          echo "  geobrix-${VERSION}-dcs.Dockerfile"
          echo "  $(basename "${GBX_DOCS_ZIP}")"
