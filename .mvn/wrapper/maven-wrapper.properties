# The one Maven for CI and for anyone running ./mvnw. The dev image installs the same version
# (MAVEN_VERSION in scripts/docker/Dockerfile) and pom.xml's enforcer requires it as a minimum.
# To bump: change the version in the URL, take the zip's SHA-256 from two Apache sources
# (archive.apache.org and dlcdn.apache.org agree on the bytes; Apache publishes only a SHA-512,
# so compute the SHA-256 from the zip and check the zip against the published SHA-512), then
# move MAVEN_VERSION + MAVEN_SHA512 in the Dockerfile and the pom's enforcer version with it.
# scripts/ci/test_maven_wrapper.py fails when any of them move alone; it reads the live files, so a
# consistent bump needs no edit to the test.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
distributionSha256Sum=5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce
