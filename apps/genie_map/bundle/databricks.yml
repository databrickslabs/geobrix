# Databricks Asset Bundle for the Genie Map app.
#
# Declarative resource set (warehouse, genie-space, app name) — kept as a simple
# named list so a future scaffold_map_app(resources) helper can be lifted from it.
#
# Deploy via: gbx:app:deploy  (pnpm build → databricks bundle deploy → run)
# Live validate/deploy happens in Task 20 — do NOT expect this to be validated here.
#
# NOTE on the `genie_space` app-resource type: some Databricks CLI versions do not
# yet recognize `genie_space` under resources.apps.<app>.resources. If `databricks
# bundle validate` rejects it, the fallback is to drop the genie-space-id resource
# block below and instead inject the Genie Space id as an app env var / secret
# (app.yaml already reads DATABRICKS_GENIE_SPACE_ID via valueFrom: genie-space-id).
# The real genie_space_id value is recorded in Task 18; validated live in Task 20.

bundle:
  name: genie-map

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com

resources:
  apps:
    genie_map:
      name: genie-map
      description: "Genie Map — vapor-eyes methane on GeoBrix"
      source_code_path: ../
      resources:
        - name: sql-warehouse-id
          sql_warehouse:
            id: 82e587bd93c6cbcf
            permission: CAN_USE
        - name: genie-space-id
          genie_space:
            id: ${var.genie_space_id}
            permission: CAN_RUN

variables:
  genie_space_id:
    description: "Curated vapor-eyes Genie Space id (from Task 18)"
    default: ""
