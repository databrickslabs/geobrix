bundle:
  name: vapor_eyes_lf

# Layer in a git-ignored databricks.override.yml (workspace profile, warehouse id,
# any local variable overrides) when present. The glob tolerates its absence, so a
# fresh clone validates/deploys with the committed defaults below.
# See databricks.override.yml.example.
include:
  - "*.override.yml"

variables:
  catalog: {default: geospatial_docs}
  schema: {default: vapor_eyes_lf}
  volume: {default: data}
  full_aoi: {default: "true"}
  # Seasonal window (summer 2023) — aligned across S5P + EMIT so screening and
  # detection are contemporaneous, and wide enough for a production-scale record
  # (~90 S5P overpass days -> rich hotspot/concentration trend + persistence,
  # several EMIT overpasses). NOTE: this downloads ~10-15 GB of S5P granules on the
  # first run; narrow both to a single day/overpass (e.g. 2023-07-31/2023-08-01) via
  # databricks.override.yml for a quick, cheap trial.
  date_window: {default: "2023-06-01/2023-08-31"}
  s5p_temporal: {default: "2023-06-01/2023-08-31"}
  h3_res: {default: "6"}
  qa_min: {default: "0.5"}
  cloud_max: {default: "20"}
  s2_h3_res: {default: "10"}
  k_candidates: {default: "5"}
  min_z: {default: "6"}
  max_z: {default: "13"}
  overview_max_z: {default: "12"}
  earthdata_secret: {default: "geospatial_docs.vapor_eyes.earthdata_token"}
  gbx_wheel: {default: "/Volumes/geospatial_docs/geobrix/sample-data/geobrix-0.4.0-py3-none-any.whl"}
  # SQL warehouse for validation queries + the AI/BI dashboard. No portable default —
  # set it in databricks.override.yml (see databricks.override.yml.example).
  warehouse_id: {default: ""}

resources:
  dashboards:
    vapor_eyes_lf_dashboard:
      display_name: "Vapor-Eyes — Methane Cascade (Lakeflow)"
      file_path: ./dashboards/vapor_eyes_lf.lvdash.json
      warehouse_id: ${var.warehouse_id}

  pipelines:
    vapor_eyes_lf_pipeline:
      name: vapor_eyes_lf_pipeline
      serverless: true
      catalog: ${var.catalog}
      schema: ${var.schema}
      root_path: ./transformations
      libraries:
        - glob:
            include: transformations/**
      environment:
        dependencies:
          # Install the geobrix wheel WITH its light/stac/vizx extras in ONE pip
          # resolution (mirrors the notebook's `%pip install geobrix[light,stac,vizx]
          # @ wheel`). Lakeflow runs one `%pip install` per dependency entry, so
          # enumerating the extras separately defeats pip's resolver — installing
          # rio-tiler after rasterio was already pinned forces a source rebuild
          # (ENVIRONMENT_PIP_INSTALL_ERROR). pip's `wheel[extras]` path form keeps it
          # a single pass and passes DAB path-normalization (no file:// colon).
          - ${var.gbx_wheel}[light,stac,vizx]
      configuration:
        vapor_eyes.catalog: ${var.catalog}
        vapor_eyes.schema: ${var.schema}
        vapor_eyes.volume: ${var.volume}
        vapor_eyes.full_aoi: ${var.full_aoi}
        vapor_eyes.date_window: ${var.date_window}
        vapor_eyes.s5p_temporal: ${var.s5p_temporal}
        vapor_eyes.h3_res: ${var.h3_res}
        vapor_eyes.qa_min: ${var.qa_min}
        vapor_eyes.cloud_max: ${var.cloud_max}
        vapor_eyes.s2_h3_res: ${var.s2_h3_res}
        vapor_eyes.k_candidates: ${var.k_candidates}
        vapor_eyes.min_z: ${var.min_z}
        vapor_eyes.max_z: ${var.max_z}
        vapor_eyes.overview_max_z: ${var.overview_max_z}

  jobs:
    vapor_eyes_lf_job:
      name: vapor_eyes_lf_job
      tasks:
        - task_key: land
          spark_python_task:
            python_file: ./land/land.py
            parameters:
              ["--sources", "s5p,emit,wells,s2", "--window", "${var.date_window}", "--s5p-temporal", "${var.s5p_temporal}", "--cloud-max", "${var.cloud_max}"]
          environment_key: land_env
        - task_key: pipeline
          depends_on: [{task_key: land}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.vapor_eyes_lf_pipeline.id}
      environments:
        - environment_key: land_env
          spec:
            environment_version: "5"
            dependencies:
              # Single-pass wheel+extras install, same rationale as the pipeline
              # environment above (avoids per-dep %pip resolver churn).
              - ${var.gbx_wheel}[light,stac,vizx]
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"
        timezone_id: "America/Chicago"
        pause_status: PAUSED

targets:
  dev:
    mode: development
    default: true
