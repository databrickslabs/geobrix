bundle:
  name: vapor_eyes_lf

variables:
  catalog: {default: geospatial_docs}
  schema: {default: vapor_eyes_lf}
  volume: {default: data}
  full_aoi: {default: "true"}
  date_window: {default: "2023-07-15/2023-08-20"}
  s5p_temporal: {default: "2024-08-23/2024-08-24"}
  h3_res: {default: "6"}
  qa_min: {default: "0.5"}
  cloud_max: {default: "20"}
  s2_h3_res: {default: "10"}
  k_candidates: {default: "5"}
  min_z: {default: "6"}
  max_z: {default: "13"}
  overview_max_z: {default: "12"}
  earthdata_secret: {default: "geospatial_docs.vapor_eyes.earthdata_token"}
  gbx_wheel: {default: "/Volumes/geospatial_docs/geobrix/sample-data/geobrix-0.4.0-py3-none-any.whl"}

resources:
  pipelines:
    vapor_eyes_lf_pipeline:
      name: vapor_eyes_lf_pipeline
      serverless: true
      catalog: ${var.catalog}
      schema: ${var.schema}
      root_path: ./transformations
      libraries:
        - glob:
            include: transformations/**
      environment:
        dependencies:
          # DAB path-normalizes every dependency string, which rejects the PEP 508
          # direct-reference form "geobrix[light,stac,vizx] @ file://...". Use a
          # bare Volume wheel path instead, plus the extras spelled out below —
          # these mirror the union of the light, stac, and vizx arrays in
          # [project.optional-dependencies] (python/geobrix/pyproject.toml).
          - ${var.gbx_wheel}
          - "rasterio>=1.3.0"
          - "shapely>=2.0.0"
          - "numpy>=1.24.0"
          - "pandas>=2.0.0"
          - "pyarrow>=11.0.0"
          - "scipy>=1.11.0"
          - "numexpr>=2.8.0"
          - "typing_extensions>=4.13"
          - "rio-tiler>=9.0,<9.3"
          - "httpcore>=1.0.9"
          - "idna<3.8"
          - "rio-cogeo>=7.0,<8"
          - "h3>=4.0,<5"
          - "quadbin>=0.2,<0.3"
          - "pmtiles>=3.4,<4"
          - "pyogrio>=0.12,<1"
          - "pyproj>=3.6,<4"
          - "mapbox-vector-tile>=2.1,<2.2"
          - "scikit-image>=0.22,<1"
          - "xarray-spatial>=0.4,<1"
          - "netcdf4>=1.6,<2"
          - "pystac-client>=0.7,<1"
          - "planetary-computer>=1.0,<2"
          - "tenacity>=8,<10"
          - "requests>=2.25"
          - "earthaccess>=0.11,<1"
          - "botocore>=1.40.45,<1.41.0"
          - "matplotlib>=3.7,<4"
          - "geopandas>=1.0,<2"
          - "mapclassify>=2.6,<3"
          - "contextily>=1.5,<2"
          - "anywidget>=0.9,<1"
          - "tippecanoe>=2.45,<3"
      configuration:
        vapor_eyes.catalog: ${var.catalog}
        vapor_eyes.schema: ${var.schema}
        vapor_eyes.volume: ${var.volume}
        vapor_eyes.full_aoi: ${var.full_aoi}
        vapor_eyes.date_window: ${var.date_window}
        vapor_eyes.s5p_temporal: ${var.s5p_temporal}
        vapor_eyes.h3_res: ${var.h3_res}
        vapor_eyes.qa_min: ${var.qa_min}
        vapor_eyes.cloud_max: ${var.cloud_max}
        vapor_eyes.s2_h3_res: ${var.s2_h3_res}
        vapor_eyes.k_candidates: ${var.k_candidates}
        vapor_eyes.min_z: ${var.min_z}
        vapor_eyes.max_z: ${var.max_z}
        vapor_eyes.overview_max_z: ${var.overview_max_z}

  jobs:
    vapor_eyes_lf_job:
      name: vapor_eyes_lf_job
      tasks:
        - task_key: land
          spark_python_task:
            python_file: ./land/land.py
            parameters:
              ["--sources", "s5p", "--s5p-temporal", "${var.s5p_temporal}"]
          environment_key: land_env
        - task_key: pipeline
          depends_on: [{task_key: land}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.vapor_eyes_lf_pipeline.id}
      environments:
        - environment_key: land_env
          spec:
            environment_version: "5"
            dependencies:
              # Mirrors the pipeline environment above: bare Volume wheel path +
              # explicit geobrix[light,stac,vizx] extras (see
              # python/geobrix/pyproject.toml [project.optional-dependencies]).
              - ${var.gbx_wheel}
              - "rasterio>=1.3.0"
              - "shapely>=2.0.0"
              - "numpy>=1.24.0"
              - "pandas>=2.0.0"
              - "pyarrow>=11.0.0"
              - "scipy>=1.11.0"
              - "numexpr>=2.8.0"
              - "typing_extensions>=4.13"
              - "rio-tiler>=9.0,<9.3"
              - "httpcore>=1.0.9"
              - "idna<3.8"
              - "rio-cogeo>=7.0,<8"
              - "h3>=4.0,<5"
              - "quadbin>=0.2,<0.3"
              - "pmtiles>=3.4,<4"
              - "pyogrio>=0.12,<1"
              - "pyproj>=3.6,<4"
              - "mapbox-vector-tile>=2.1,<2.2"
              - "scikit-image>=0.22,<1"
              - "xarray-spatial>=0.4,<1"
              - "netcdf4>=1.6,<2"
              - "pystac-client>=0.7,<1"
              - "planetary-computer>=1.0,<2"
              - "tenacity>=8,<10"
              - "requests>=2.25"
              - "earthaccess>=0.11,<1"
              - "botocore>=1.40.45,<1.41.0"
              - "matplotlib>=3.7,<4"
              - "geopandas>=1.0,<2"
              - "mapclassify>=2.6,<3"
              - "contextily>=1.5,<2"
              - "anywidget>=0.9,<1"
              - "tippecanoe>=2.45,<3"
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"
        timezone_id: "America/Chicago"
        pause_status: PAUSED

targets:
  dev:
    mode: development
    default: true
