bundle:
  name: wireless_coverage_lf

# Layer in a git-ignored databricks.override.yml (workspace profile, any local
# variable overrides) when present. The glob tolerates its absence, so a fresh
# clone validates/deploys with the committed defaults below.
# See databricks.override.yml.example.
include:
  - "*.override.yml"

variables:
  catalog: {default: geospatial_docs}
  schema: {default: wireless_coverage_lf}
  volume: {default: data}
  full_aoi: {default: "true"}
  # empty → derived under the LDP volume; set to the series path to share
  # already-staged LiDAR and skip a second ~830 MB download.
  laz_dir: {default: ""}
  water_mask_dir: {default: ""}
  gbx_wheel: {default: "/Volumes/geospatial_docs/geobrix/sample-data/geobrix-0.5.2-py3-none-any.whl"}

resources:
  pipelines:
    wireless_coverage_lf_pipeline:
      name: wireless_coverage_lf_pipeline
      serverless: true
      catalog: ${var.catalog}
      schema: ${var.schema}
      root_path: ./transformations
      libraries:
        - glob:
            include: transformations/**
      environment:
        dependencies:
          # The Lakeflow SDP pipeline runs on the DLT runtime channel — currently
          # DBR 18.3.x (protobuf-5) — so it uses the DBR-language [light_dbr18] extra,
          # NOT [light_env6] (the protobuf-6 / DBR-19 regime). Installed WITH vizx in
          # ONE pip resolution: Lakeflow runs one `%pip install` per dependency entry,
          # so splitting the extras defeats pip's resolver (rio-tiler after a pinned
          # rasterio forces a source rebuild / ENVIRONMENT_PIP_INSTALL_ERROR). The
          # `wheel[extras]` path form keeps it a single pass + DAB-path-safe.
          - ${var.gbx_wheel}[light_dbr18,vizx]
      configuration:
        wireless_coverage.catalog: ${var.catalog}
        wireless_coverage.schema: ${var.schema}
        wireless_coverage.volume: ${var.volume}
        wireless_coverage.full_aoi: ${var.full_aoi}
        wireless_coverage.laz_dir: ${var.laz_dir}
        wireless_coverage.water_mask_dir: ${var.water_mask_dir}
        # (all other wireless_coverage.* keys use _config.py inline defaults)

  jobs:
    wireless_coverage_lf_job:
      name: wireless_coverage_lf_job
      tasks:
        - task_key: land
          spark_python_task:
            python_file: ./land/land.py
            parameters:
              - "--catalog"
              - ${var.catalog}
              - "--schema"
              - ${var.schema}
              - "--volume"
              - ${var.volume}
              - "--full-aoi"
              - ${var.full_aoi}
              - "--laz-dir"
              - ${var.laz_dir}
              - "--water-mask-dir"
              - ${var.water_mask_dir}
          environment_key: wc_env
        - task_key: pipeline
          depends_on:
            - task_key: land
          pipeline_task:
            pipeline_id: ${resources.pipelines.wireless_coverage_lf_pipeline.id}
        - task_key: siting
          depends_on:
            - task_key: pipeline
          spark_python_task:
            python_file: ./siting/siting.py
            parameters:
              - "--catalog"
              - ${var.catalog}
              - "--schema"
              - ${var.schema}
              - "--volume"
              - ${var.volume}
              - "--full-aoi"
              - ${var.full_aoi}
          environment_key: wc_env
        - task_key: validate
          depends_on:
            - task_key: siting
          notebook_task:
            notebook_path: ./validate/validate_wc_lf.ipynb
          environment_key: wc_env
      environments:
        - environment_key: wc_env
          spec:
            # Serverless job tasks use Environment-language versioning. Env 5 is the
            # protobuf-5 base equivalent to the Lakeflow pipeline's DBR 18.3 runtime
            # (DBR 18 <-> Env 5), so the extra is [light_env5] (= light_dbr18). Keep
            # the env version and the extra in lockstep — a mismatched base + extra
            # trips the "core package versions changed" job failure.
            environment_version: "5"
            dependencies:
              # Single-pass wheel+extras install, same rationale as the pipeline
              # environment above (avoids per-dep %pip resolver churn).
              - ${var.gbx_wheel}[light_env5,vizx]
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"
        timezone_id: "America/Chicago"
        pause_status: PAUSED

targets:
  # No `mode: development` on purpose: dev mode force-prefixes every resource with
  # "[dev <user>]" and ignores an empty name_prefix override, which we don't want for
  # a demo/showcase. Omitting mode deploys with clean, unprefixed resource names.
  # The pipeline's catalog/schema are fully explicit via vars, so published tables
  # are unaffected regardless of target.
  dev:
    default: true
  prod:
