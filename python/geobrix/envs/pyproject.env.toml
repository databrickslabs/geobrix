# The env wheels' pyproject (ruling NP-3): gbx:build:wheel --env 5|6 copies it, as pyproject.toml,
# into a scratch tree with the package source, envs/env<N>/ as env/ and the native payload, then
# appends one `optional-dependencies.<name> = {file = [...]}` line per extra and per tripwire name
# to [tool.setuptools.dynamic] (the last table). The committed python/geobrix/pyproject.toml is
# unchanged; the builder fails unless name, license and authors equal its own and requires-python
# admits only versions the committed range admits (ruling NP-10: the payload is cp312-only).

[project]
name = "geobrix"
authors = [
    { name = "Michael Johns" },
    { name = "Stuart Lynn" },
    { email = "labs@databricks.com"}
]
dynamic = ["version", "dependencies", "optional-dependencies"]
description = "GeoBriX: A high-performance spatial processing library for Apache Spark."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Databricks-Proprietary"
classifiers = [
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    'Operating System :: POSIX :: Linux'
]

[project.urls]
Homepage = "https://databricks.com/learn/labs"
Repository = "https://github.com/databrickslabs/geobrix"
Documentation = "https://databrickslabs.github.io/geobrix/"

[build-system]
requires = ["setuptools>=80.9,<85", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
# Imported at interpreter start by geobrix-native.pth, which the builder adds to the wheel root.
py-modules = ["_gbx_native_path"]
include-package-data = false

# databricks/ and databricks/labs/ stay PEP 420 namespace directories (they are shared with
# databricks-sdk and databricks-connect). The payload's directories are package data, never
# packages: _vendor/ holds other projects' packages, _native/<arch>/ holds libraries.
[tool.setuptools.packages.find]
where = ["src"]
include = ["databricks.labs.gbx*"]
exclude = ["databricks.labs.gbx._vendor*", "databricks.labs.gbx._native.*", "databricks.labs.gbx._jar*"]
namespaces = true

[tool.setuptools.package-data]
"databricks.labs.gbx._native" = ["x86_64/**/*", "aarch64/**/*", "share/**/*", "licenses/**/*"]
"databricks.labs.gbx" = ["_vendor/**/*", "_jar/*.jar"]
# As in the committed pyproject: the canonical registered-function list for the bench, and the
# per-surface manifest the registrar and the UC DDL emitter read at run time.
"databricks.labs.gbx.bench" = ["registered_functions.txt"]
"databricks.labs.gbx.manifest" = ["*.json"]

[tool.setuptools.dynamic]
version = {attr = "databricks.labs.gbx.__version__"}
dependencies = {file = ["env/core.txt"]}
