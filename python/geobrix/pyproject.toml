[project]
name = "geobrix"
authors = [
    { name = "Michael Johns" },
    { name = "Stuart Lynn" },
    { email = "labs@databricks.com"}
]
dynamic = ["version"]
description = "GeoBriX: A high-performance spatial processing library for Apache Spark."
readme = "README.md"
requires-python = ">=3.10, <3.13"

# PEP 639 SPDX expression form. setuptools >=77 deprecated the table form
# (`{ text = ... }` / `{ file = ... }`) and warns on every build by 2027-Feb-18.
# Proprietary licenses use the `LicenseRef-<id>` namespace per PEP 639;
# canonical license text lives in ../../LICENSE at the repo root.
license = "LicenseRef-Databricks-Proprietary"
classifiers = [
    # PEP 639: License classifiers are forbidden once `project.license` is a SPDX
    # expression — setuptools >=77 raises InvalidConfigError on overlap.
    # The license is expressed above via `license = "LicenseRef-Databricks-Proprietary"`.
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    'Operating System :: OS Independent'
]
# This is the plain wheel, for use OFF Databricks: a laptop, a non-Linux machine, another Python, a
# GDAL you bring yourself. On Databricks install the env wheel for the runtime instead
# (geobrix-<version>+env5 for DBR 17.3 / 18, Serverless environment 5 and Lakeflow pipelines;
# geobrix-<version>+env6 for DBR 19, Serverless environment 6, SQL warehouses and UC functions):
# it carries one GDAL stack built for it and holds the runtime's preinstalled packages.
#
# The base dependencies are the light tier, so `pip install geobrix` gives a working light tier.
# Floors only, no caps: off Databricks there is no preinstalled base to hold, and a cap only
# turns a newer release into a resolution failure. rasterio, pyogrio, pyproj, shapely and
# netCDF4 bring their own GDAL / PROJ / GEOS builds from PyPI here.
#
# PySpark is NOT a base dependency. Every supported runtime provides its own (DBR 17.3/18/19
# classic ship it on /databricks/spark/python; Serverless env 5/6 and Lakeflow pipelines register
# a Spark Connect pyspark), and a declared `pyspark` made `%pip install geobrix[...]` download
# ~450 MB of OSS PySpark on Connect-based compute for nothing. Local/OSS Spark users install
# PySpark (4.0.0 or newer) themselves; the [test] extra carries it for tests and local runs.
dependencies = [
    "rasterio>=1.3.0",
    "shapely>=2.1.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=11.0.0",
    "scipy>=1.11.0",
    # The safe expression evaluator of rst_mapalgebra (no arbitrary-code exec).
    "numexpr>=2.14.1",
    "h3>=4.1",
    "quadbin>=0.2",
    # Protomaps PMTiles archive writer/reader (pure Python) for the pmtiles_gbx backend.
    "pmtiles>=3.4",
    # OGR-free vector reading for the light *_gbx vector DataSources (pyogrio bundles its own
    # libgdal; pyproj maps CRS -> srid/proj4).
    "pyogrio>=0.12",
    "pyproj>=3.6",
    # Web-mercator XYZ tiling. rio-tiler 9.x declares TypedDict(extra_items=...) (PEP 728),
    # which works from typing_extensions 4.13.0 while rio-tiler's own metadata asks only for
    # 4.10: the floor below is what lets `import rio_tiler` succeed.
    "rio-tiler>=9.0",
    "typing_extensions>=4.13",
    "mapbox-vector-tile>=2.1",
    "scikit-image>=0.22",
    # scikit-image imports lazy_loader at import time; >=0.5 makes pip install it beside
    # scikit-image even where an older lazy_loader is already present.
    "lazy_loader>=0.5",
    # NetCDF decode for the netcdf_gbx reader (and gbx.zarr's xarray views): xarray with the
    # netcdf4 engine, one wheel bundling netcdf-c and HDF5 (NetCDF-3 and NetCDF-4/HDF5).
    "xarray>=2025.1",
    "netcdf4>=1.6",
    # Entity-hardened XML parsing for external-origin GDAL .vrt mosaic indexes (the stdlib
    # parser is open to XXE / billion-laughs on an untrusted .vrt).
    "defusedxml>=0.7",
    # LiDAR point clouds (lidar_gbx; lazrs is the pure-Rust LAZ backend). lazrs 0.8.2 returns
    # an error where 0.8.0 / 0.8.1 printed a Rust panic on a short LAZ file.
    "laspy>=2.7",
    "lazrs>=0.8.2",
    # Camera / GPS EXIF from drone imagery (exif_gbx), pure Python.
    "exifread>=3.0",
]

[project.urls]
Homepage = "https://databricks.com/learn/labs"
Repository = "https://github.com/databrickslabs/geobrix"
Documentation = "https://databrickslabs.github.io/geobrix/"

[project.optional-dependencies]
dev = [
    # Lint toolchain — pins MUST match python/geobrix/requirements-ci.in so that
    # `gbx:lint:python --fix` (host .venv) produces byte-identical output to CI and
    # to the dev container's `--check`. Unpinned here previously let the .venv resolve
    # to newer black/isort than CI, so host-formatted files failed CI's black --check.
    # When bumping requirements-ci.in, bump these in the same commit.
    "isort==8.0.1",
    "black==26.10.1",
    "flake8==7.3.0",
    "flake8-pyproject==1.2.4",
    "build==1.6.1",
]
test = [
    # Not a base dependency (Databricks provides it) — tests and local Spark runs need it.
    "pyspark>=4.0.0",
    "pytest>=7.0",
    "shapely>=2.1.0",
    "rasterio>=1.3.0",
    "numpy>=1.24.0",
    # pyvx (light VectorX / MVT) tests use mapbox-vector-tile as the decode
    # oracle. Pinned to 2.1.x: 2.2 needs protobuf 6, which DBR 17.3 / 18 and Serverless
    # environment 5 do not have (the env5 wheel vendors 2.1.0).
    # 2.1.0 still has the 2.x native-typed-attribute encode API.
    "mapbox-vector-tile>=2.1,<2.2",
]
# ---------------------------------------------------------------------------
# The 0.5.x runtime extras are TRIPWIRES. On Databricks GeoBrix 0.6.0 installs the env wheel for
# the runtime, with no light extra: geobrix-<version>+env5 (DBR 17.3, DBR 18, Serverless
# environment 5, Lakeflow pipelines) or geobrix-<version>+env6 (DBR 19, Serverless environment 6,
# SQL warehouses, UC functions). Each old name requires that env wheel, so an install that still
# asks for it fails at resolution (pip: ResolutionImpossible), naming the wheel to install,
# instead of installing this plain wheel's PyPI GDAL stack beside the runtime's packages. The env
# wheels declare the other family's names the same way. The version is __version__'s (a guard
# row checks it); [light-base] is gone: its packages are the base dependencies above.
# ---------------------------------------------------------------------------
light_dbr17 = ["geobrix==0.6.0+env5"]
light_dbr18 = ["geobrix==0.6.0+env5"]
light_env5 = ["geobrix==0.6.0+env5"]
light_dbr17_all = ["geobrix==0.6.0+env5"]
light_dbr18_all = ["geobrix==0.6.0+env5"]
light_env5_all = ["geobrix==0.6.0+env5"]
light_dbr19 = ["geobrix==0.6.0+env6"]
light_env6 = ["geobrix==0.6.0+env6"]
light_dbr19_all = ["geobrix==0.6.0+env6"]
light_env6_all = ["geobrix==0.6.0+env6"]
# ---------------------------------------------------------------------------
# Zarr transactional stores (gbx.zarr). Canonical body: zarr_dbr19. Alias: zarr_env6. On
# Databricks the env6 wheel's [zarr] carries these pins (DBR 19, DBR 19 ML, Serverless env 6):
#   pip install "geobrix[zarr] @ file:///Volumes/.../geobrix-<version>+env6-py3-none-any.whl"
# Off Databricks: pip install "geobrix[zarr_dbr19]".
# Floors are at or below what the DBR 19 / env 6 / DBR 19 ML base ships (numpy>=2,
# typing_extensions>=4.14, packaging>=22, google-crc32c>=1.5, pyyaml), so nothing
# preinstalled moves. Do NOT cap those shared packages: a cap under a later base bump
# becomes a downgrade. Not for DBR 17.3 / 18 / env 5: Zarr support targets DBR 19 and env 6
# only (zarr 3.4 also needs typing_extensions>=4.14, and their base ships 4.12.2). Each
# package is minor-capped because zarrs subclasses zarr internals and documents no zarr
# ceiling: widen a cap only after a re-test.
# ---------------------------------------------------------------------------
zarr_dbr19 = [
    "zarr>=3.4.1,<3.5",           # sharded v3 stores; pulls msgspec>=0.19 and donfig>=0.8
    "numcodecs>=0.17,<0.18",      # needs python>=3.12 and numpy>=2
    "zarrs>=0.2.3,<0.3",          # ZarrsCodecPipeline; declares only zarr>=3.1, hence the zarr cap
    "tensorstore>=0.1.85,<0.2",   # needs ml_dtypes>=0.5.0
    "obstore>=0.11,<0.13",        # object-store access; replaces fsspec/s3fs (base fsspec is 2023.5.0)
    "ml_dtypes>=0.5,<1",
    "msgspec>=0.19,<1",
    "donfig>=0.8,<1",
]
# Serverless env 6 -- aliases the canonical protobuf-6 Zarr extra [zarr_dbr19].
zarr_env6 = ["geobrix[zarr_dbr19]"]
# For sample-data bundle uploads to Unity Catalog Volumes and gbx:test:bundle-databricks
databricks = [
    "databricks-sdk",
]
# Overture Maps data source (gbx.sample.overture): static-STAC catalog traversal.
# pystac is the static-catalog reader; pyarrow (a base dependency) does the parquet read; the
# overturemaps CLI, when installed, is the bbox fast path.
# overturemaps 1.x requires click>=8.3.0 and tqdm>=4.67.3, so on Databricks it moves preinstalled
# packages (click 8.1.7-8.2.1 -> 8.5.0 on every runtime; tqdm 4.67.1 -> 4.70.1 on DBR 18/19 and
# env 5/6, newly installed on DBR 17.3) and it requires shapely by name. The env wheels therefore
# have no [overture]: there it is a separate `pip install "overturemaps>=1.0.2,<2"` step with
# those costs (pystac is already an env wheel dependency).
# The >=1.0.2 floor fences out 1.0.0 and 1.0.1, which predate the fix for absolute STAC catalog hrefs.
overture = [
    "pystac>=1.9,<2",
    "overturemaps>=1.0.2,<2",
]
# STAC catalog client (lightweight): distributed search + resilient download + repair.
# Optional, so users who don't need STAC don't pull pystac-client/planetary-computer.
# The env wheels' [stac] holds the runtime's requests instead (envs/env<N>/extra-stac.txt).
stac = [
    "pystac-client>=0.7,<1",
    "planetary-computer>=1.0,<2",
    "tenacity>=8,<10",
    "requests>=2.34.2",
]
# NASA Earthdata / LP DAAC client (gbx.earthdata) + the EMIT CH4 sample downloader
# (gbx.sample.emit). earthaccess pulls s3fs, which ties fsspec+botocore to one release era
# and CANNOT be installed quietly against a Databricks base carrying old fsspec (2023.5.0) +
# new botocore (1.40.45): installing it WILL move fsspec (and/or botocore/urllib3). The env
# wheels therefore have no [earthdata]: there it is a separate
# `pip install "earthaccess>=0.11,<1" "botocore<1.44.0"` step, and it moves fsspec.
earthdata = [
    "earthaccess>=0.11,<1",
    # earthaccess -> s3fs -> aiobotocore -> botocore. Ceiling <1.44.0 spans supported
    # bases without forcing botocore above the pre-installed boto3's own floor.
    "botocore<1.44.0",
]
# Visualization helpers (gbx.vizx): matplotlib raster rendering + geopandas map
# adapters, interactive MapLibre GL viewer (anywidget), and tippecanoe-based
# tile simplification.  Optional so light-tier users who don't visualize don't
# pull the GUI stack.  Package code imports only matplotlib + geopandas at
# module level; anywidget, tippecanoe, and mapclassify are optional at call time.
vizx = [
    "matplotlib>=3.7,<4",
    "geopandas>=1.1.4,<2",
    "mapclassify>=2.6,<3",
    "contextily>=1.5,<2",
    "anywidget>=0.9,<1",
    "tippecanoe>=2.72.0,<3",
    "imageio>=2.28,<3",
    "imageio-ffmpeg>=0.4,<2",
]
# Photogrammetry (example-only): COLMAP SfM + ortho render deps. Not a base dependency.
# On Databricks the env wheel already carries rasterio and pmtiles: there, install pycolmap
# (or pycolmap-cuda12 on Serverless GPU environment 5) as a separate step.
photogrammetry = [
    "pycolmap==4.2.1",
    "rasterio>=1.3",
    "pmtiles",
]
# GPU is env5-only on purpose: Serverless GPU AI Runtime env5 = CUDA 12 (matches pycolmap-cuda12).
# env6 = CUDA 13 and no pycolmap-cuda13 wheel exists on the proxy -> no photogrammetry_gpu_env6 until it does.
photogrammetry_gpu_env5 = [
    "pycolmap-cuda12==4.2.1",
    "rasterio>=1.3",
    "pmtiles",
]
# Model-backed raster inference (gbx.models): GeoSAM (segment-geospatial / SamGeo)
# segmentation + Unity Catalog model serving. CPU-importable surface only -- torch and
# segment-geospatial are imported lazily inside gbx.models (see geosam.py/__init__.py),
# so importing the package never requires a GPU-capable torch build. The plain
# `segment-geospatial` PyPI wheel already pulls its own default
# torch/torchvision/segment-anything/rasterio/shapely closure; use
# [models_gpu_env5] for a CUDA-12-pinned runtime install instead.
models = [
    "segment-geospatial",
]
# GPU is env5-only on purpose, mirroring [photogrammetry_gpu_env5]: Serverless GPU AI
# Runtime env5 = CUDA 12, env6 = CUDA 13, and GeoBrix standardizes its whole GPU stack on
# CUDA 12 (pycolmap-cuda12 has no CUDA-13 build -- see nb1b / Part 1b). torch's default PyPI
# Linux wheel bundles CUDA 12 through torch 2.10.x; torch==2.11.0 flips the default wheel to
# CUDA 13 (nvidia-*-cu13 / cuda-toolkit==13.0.2 -- confirmed via each release's wheel METADATA
# on the PyPI mirror, 2026-09-28). So torch MUST stay pinned below 2.11 to remain CUDA-12,
# else segment-geospatial floats it to a CUDA-13 build. Pin to the env5 BASE's torch
# (2.9.0 / torchvision 0.24.0 -- itself CUDA-12, cu129) rather than the newest CUDA-12 release
# (2.10.0): both honor the CUDA-12 requirement, but matching the base means pip does NOT
# upgrade the base torch -- a 2.10.0 upgrade otherwise collides with the base's
# torch==2.9.0-pinned torchaudio / vllm / xformers and prints noisy pip "ERROR" conflict lines
# (ugly in a public example). torchvision pins its torch exactly per release (0.24.0 -> 2.9.0),
# so both are pinned. No models_gpu_env6 until a CUDA-13 torch pairing is verified, same as
# photogrammetry_gpu_env5/env6.
models_gpu_env5 = [
    "torch==2.9.0",
    "torchvision==0.24.0",
    "segment-geospatial",
    # segment-geospatial pulls opencv-python-headless UNPINNED, so it inherits the GPU
    # AI Runtime base env's opencv-python-headless 5.0.0.93. OpenCV *5.x*'s bundled libs
    # trip an OpenSSL FIPS self-test abort (crypto/fips/fips.c:154 -> SIGABRT) the moment
    # `import cv2` runs on the GPU node -- killing `segment_raster` before it starts
    # (verified env5+A10 and env5+H100, 2026-09-29). Pinning back to the latest OpenCV
    # 4.x avoids the defect (verified: env5+H100 with this pin runs GeoSAM end to end).
    # See memory: check-actual-gpu-env-packages.
    "opencv-python-headless==4.11.0.86",
]
# Generic GPU umbrella (env5-only): composes the GPU-requiring extras. On Databricks (Serverless
# GPU environment 5) they install as a separate step after the env5 wheel.
gpu_env5_all = [
    "geobrix[photogrammetry_gpu_env5]",
    "geobrix[models_gpu_env5]",
]

[tool.coverage.run]
# Exclude sample-data bundle from coverage total so reported % reflects main library (gridx, rasterx, vectorx)
# Multiple patterns ensure exclusion when paths are relative (src/...) or absolute; required for CI and local.
omit = [
    "*sample/_bundle.py",
    "*_bundle.py",
    "src/databricks/labs/gbx/sample/_bundle.py",
    "databricks/labs/gbx/sample/_bundle.py",
    "python/geobrix/src/databricks/labs/gbx/sample/_bundle.py",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]

[tool.pytest.ini_options]
pythonpath = [ "src", "." ]
markers = [
    "integration: tests that need network or long-running setup (excluded from CI)",
    "perf: slow tessellate / geomk / streamed-merge cases (some are correctness oracles that are only slow, some bound memory); skipped by gbx:test:pyrx and gbx:test:light by default (--perf includes them), still run by CI",
    "delta: tests that run on the local Spark/Delta session (test/zarr marks them in its conftest.py, other tests mark themselves); -m 'not delta' is the fast, Spark-free inner loop",
    "gdal_policy: a row of the GDAL driver policy; the policy_meta row fails if one skipped where the payload is present",
    "policy_meta: the one meta-row that checks the gdal_policy rows' outcomes (runs after them, see test/conftest.py)",
    "connect: tests that use the spark_connect_local fixture (marked in test/conftest.py, not by hand); they cannot share a process with classic-session tests, so gbx:test:pyrx / gbx:test:light run them in a second pytest process and gbx:test:parity leaves them out",
]
filterwarnings = [
    "ignore:Support for class-based .* config.* deprecated:",
    "ignore:Neither gdal.UseExceptions:FutureWarning",
]

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]

[tool.setuptools]
include-package-data = false

# databricks.labs.* must be PEP 420 namespace packages (no __init__.py at
# databricks/ or databricks/labs/) so they coexist with databricks-sdk /
# databricks-connect, which share the `databricks` namespace. find_namespace
# discovery includes the gbx subpackages without those shadowing __init__ files.
[tool.setuptools.packages.find]
where = ["src"]
# Only the gbx subtree is a real package; databricks/ and databricks/labs/ stay
# pure PEP 420 namespace dirs (no __init__.py, not listed) so setuptools doesn't
# synthesize empty __init__.py for them in the wheel (which would re-shadow
# databricks-sdk). namespaces=true keeps PEP 420 discovery for the subtree.
include = ["databricks.labs.gbx*"]
namespaces = true

[tool.setuptools.package-data]
geobrix = ["lib/*.jar", "resources/*.png"]
# Ship the canonical registered-function list inside the bench package so the heavy
# vs light comparison (spec.registered_rst) works when installed without the repo
# tree (e.g. the wheel on a cluster). Kept in sync with the canonical
# docs/tests-function-info/registered_functions.txt by check-binding-parity.py.
"databricks.labs.gbx.bench" = ["registered_functions.txt"]
# The per-surface manifest (functions.json) is read at runtime by the registrar and the UC DDL emitter.
"databricks.labs.gbx.manifest" = ["*.json"]

[tool.setuptools.dynamic]
version = {attr = "databricks.labs.gbx.__version__"}

[tool.black]
line-length = 88
target-version = ["py310", "py312"]
include = '\.pyi?$'
extend-exclude = '/(\.git|__pycache__|dist)/'

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88
known_first_party = ["databricks"]
default_section = "THIRDPARTY"

[tool.flake8]
# E203/E704/W503 are the standard black-compatibility exclusions (black emits
# one-line `def f(): ...` stubs for Protocol methods, which trip E704).
ignore = ["E203", "E266", "E501", "E704", "W503"]
max-line-length = 88
max-complexity = 20
select = ["B", "C", "E", "F", "W", "T4"]
exclude = [".git", "__pycache__", "docs/conf.py", "dist"]
