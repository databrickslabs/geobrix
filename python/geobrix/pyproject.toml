[project]
name = "geobrix"
authors = [
    { name = "Michael Johns" },
    { name = "Stuart Lynn" },
    { email = "labs@databricks.com"}
]
dynamic = ["version"]
description = "GeoBriX: A high-performance spatial processing library for Apache Spark."
readme = "README.md"
requires-python = ">=3.10, <3.13"

# PEP 639 SPDX expression form. setuptools >=77 deprecated the table form
# (`{ text = ... }` / `{ file = ... }`) and warns on every build by 2027-Feb-18.
# Proprietary licenses use the `LicenseRef-<id>` namespace per PEP 639;
# canonical license text lives in ../../LICENSE at the repo root.
license = "LicenseRef-Databricks-Proprietary"
classifiers = [
    # PEP 639: License classifiers are forbidden once `project.license` is a SPDX
    # expression — setuptools >=77 raises InvalidConfigError on overlap.
    # The license is expressed above via `license = "LicenseRef-Databricks-Proprietary"`.
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    'Operating System :: OS Independent'
]
dependencies = [
    "pyspark>=4.0.0",
]

[project.urls]
Homepage = "https://databricks.com/learn/labs"
Repository = "https://github.com/databrickslabs/geobrix"
Documentation = "https://databrickslabs.github.io/geobrix/"

[project.optional-dependencies]
dev = [
    # Lint toolchain — pins MUST match python/geobrix/requirements-ci.in so that
    # `gbx:lint:python --fix` (host .venv) produces byte-identical output to CI and
    # to the dev container's `--check`. Unpinned here previously let the .venv resolve
    # to newer black/isort than CI, so host-formatted files failed CI's black --check.
    # When bumping requirements-ci.in, bump these in the same commit.
    "isort==8.0.1",
    "black==26.3.1",
    "flake8==7.3.0",
    "flake8-pyproject==1.2.4",
    "build==1.4.4",
]
test = [
    "pytest>=7.0",
    "shapely>=2.1.0",
    "rasterio>=1.3.0",
    "numpy>=1.24.0",
    # pyvx (light VectorX / MVT) tests use mapbox-vector-tile as the decode
    # oracle. Pinned to 2.1.x — see the [light_dbr17] extra for why (protobuf <6
    # on classic DBR 17.3/18; [light_env5] and [light_dbr17/18] are protobuf-5).
    # 2.1.0 still has the 2.x native-typed-attribute encode API.
    "mapbox-vector-tile>=2.1,<2.2",
]
# Internal composition extra — NOT for direct user installation.
# Intentionally named `light-base` (not a runtime extra) to distinguish it from
# user-facing extras. pip has no mechanism to mark an extra as private; contributors
# must treat it as a build-time composition tool. Install geobrix[light_env6]
# (Serverless env 6, recommended) or geobrix[light_env5] (env 5), or
# geobrix[light_dbr17/18/19] for classic clusters — NOT [light-base] directly.
light-base = [
    "rasterio>=1.3.0",
    "shapely>=2.1.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=11.0.0",
    "scipy>=1.11.0",
    "numexpr>=2.8.0",
    "rio-cogeo>=7.0,<8",
    "h3>=4.0,<5",
    "quadbin>=0.2,<0.3",
    # Protomaps PMTiles archive writer/reader (pure-Python) for the pmtiles_gbx
    # tiled-output backend. Writer needs ascending tileid; Reader used in tests.
    "pmtiles>=3.4,<4",
    # OGR-free vector reading for the light *_gbx vector DataSources. pyogrio
    # bundles its own libgdal; pyproj (pulled by pyogrio) maps CRS->srid/proj4.
    "pyogrio>=0.12,<1",
    # Cap pyproj: a floor-only, native-PROJ-tied dep that floats to "latest" on
    # Serverless (not held by the immutable base) — same float-and-break risk as
    # rio-tiler 9.3.0. No 4.x exists yet, so <4 is a no-op today but future-proofs.
    "pyproj>=3.6,<4",
    # Functional floor only; the protobuf-5 cap (light_dbr17/18/env5) and the
    # protobuf-6 floor (light_dbr19/env6) live in the per-regime variant deltas below.
    "mapbox-vector-tile>=2.1",
    "scikit-image>=0.22,<1",
    "xarray-spatial>=0.4,<1",
    # NetCDF decode for the netcdf_gbx reader. xarray is already pulled by
    # xarray-spatial; netcdf4 is the one new engine — a single wheel bundling
    # netcdf-c + HDF5, reading both NetCDF-3 and NetCDF-4/HDF5 (S5P, ERA5).
    # Folded into [light-base] so any geobrix[light_*] reads NetCDF out of the box.
    # Floor pinned; add a ceiling if a future release floats/breaks on py3.12,
    # same discipline as the rio-tiler / mapbox-vector-tile pins above.
    "netcdf4>=1.6,<2",
    # Entity-hardened XML parsing for external-origin GDAL .vrt mosaic indexes
    # (raster_gbx VRT expansion). The stdlib xml.etree parser is vulnerable to
    # XXE / billion-laughs on an untrusted .vrt; defusedxml is the safe parser
    # _parse_vrt_members prefers. Dep-free, pure Python. Floor pinned; <1
    # future-proofs (no 1.x exists today).
    "defusedxml>=0.7,<1",
]
# ---------------------------------------------------------------------------
# protobuf-5 regime — classic DBR 17.3, DBR 18, Serverless env 5
# Base images ship protobuf 3.x/4.x; mapbox-vector-tile 2.2 would pull
# protobuf>=6, so cap at <2.2. idna base is 3.7; cap <3.8 to silence the
# "core package changed: idna" notebook notice.
# Canonical body: light_dbr17. Aliases: light_dbr18, light_env5.
# ---------------------------------------------------------------------------
# Canonical protobuf-5 runtime extra. Classic DBR 17.3.
light_dbr17 = [
    "geobrix[light-base]",
    "typing_extensions>=4.13",
    # rio-tiler 9.3.0 regressed a PEP 728 TypedDict import on Python 3.12; both
    # pb5 and pb6 environments are py3.12, so <9.3 is unified across all regimes.
    "rio-tiler>=9.0,<9.3",
    "httpcore>=1.0.9",
    "idna<3.8",                     # DBR 17.3/18/env5 protobuf-5 base idna 3.7
    "mapbox-vector-tile>=2.1,<2.2", # protobuf-5 cap (2.2 would pull protobuf 6)
]
# Classic DBR 18 — identical package set to DBR 17.3 (protobuf-5 regime).
# Aliases the canonical protobuf-5 extra [light_dbr17].
light_dbr18 = ["geobrix[light_dbr17]"]
# Serverless env 5 — protobuf-5 regime (same package set as DBR 17.3/18).
# Aliases the canonical protobuf-5 extra [light_dbr17].
light_env5 = ["geobrix[light_dbr17]"]

# ---------------------------------------------------------------------------
# protobuf-6 regime — classic DBR 19, Serverless env 6 (recommended)
# Base images ship protobuf 6.x; mapbox-vector-tile 2.2 installs cleanly.
# idna base is 3.11; cap <3.12 to silence the "core package changed: idna"
# notebook notice. Env 6 is the recommended Serverless environment.
# Canonical body: light_dbr19. Alias: light_env6.
# ---------------------------------------------------------------------------
# Canonical protobuf-6 runtime extra. Classic DBR 19.
light_dbr19 = [
    "geobrix[light-base]",
    # --- Classic DBR 19 / Serverless env 6 runtime-sensitive pins ---
    "typing_extensions>=4.13",  # DBR 19 / env 6 ship 4.13+; floor harmless
    # rio-tiler <9.3 unified across both regimes: 9.3.0 has a PEP 728 TypedDict
    # regression on Python 3.12 (both pb5 and pb6 environments are py3.12).
    # Tightened from the previous <9.4 relaxation, which was unverified and
    # could silently resolve to a broken 9.3.x on py3.12.
    "rio-tiler>=9.0,<9.3",
    "httpcore>=1.0.9",          # DBR 19 / env 6 ship >=1.0.9; floor harmless
    # idna cap: DBR 19 / env 6 base idna is 3.11; cap <3.12 to silence the
    # "a core package changed: idna" notebook notice. idna is API-stable 3.x;
    # the cap is cosmetic but keeps the base idna consistent. Confirmed 2026-08-23:
    # light_dbr19 also runs on dogfood Serverless env 6 — the notice applies there.
    "idna<3.12",
    # Protobuf-6 floor: require >=2.2 (drops the protobuf-5-era <2.2 cap).
    "mapbox-vector-tile>=2.2",
]
# Serverless env 6 — protobuf-6 regime, RECOMMENDED on Serverless.
# Aliases the canonical protobuf-6 extra [light_dbr19].
# On Serverless, prefer env 6; use [light_env5] only when targeting env 5.
light_env6 = ["geobrix[light_dbr19]"]

# ---------------------------------------------------------------------------
# Feature-complete (_all) umbrellas — runtime + stac + vizx + overture
# [databricks] is NOT included: it is a Databricks SDK integration (sample-data
# upload helpers), not a geo feature, and Databricks compute already provides
# its runtime. Install [databricks] explicitly if needed.
# pb5-all canonical: light_dbr17_all. Aliases: light_dbr18_all, light_env5_all.
# pb6-all canonical: light_dbr19_all. Alias: light_env6_all.
# ---------------------------------------------------------------------------
# Canonical protobuf-5 all-features extra.
light_dbr17_all = [
    "geobrix[light_dbr17]",
    "geobrix[stac]",
    "geobrix[vizx]",
    "geobrix[overture]",
]
# Classic DBR 18 all-features — aliases the canonical pb5 all-features extra.
light_dbr18_all = ["geobrix[light_dbr17_all]"]
# Serverless env 5 all-features — aliases the canonical pb5 all-features extra.
light_env5_all = ["geobrix[light_dbr17_all]"]
# Canonical protobuf-6 all-features extra.
light_dbr19_all = [
    "geobrix[light_dbr19]",
    "geobrix[stac]",
    "geobrix[vizx]",
    "geobrix[overture]",
]
# Serverless env 6 all-features — aliases the canonical pb6 all-features extra.
# Recommended for Serverless full installs.
light_env6_all = ["geobrix[light_dbr19_all]"]
# For sample-data bundle uploads to Unity Catalog Volumes and gbx:test:bundle-databricks
databricks = [
    "databricks-sdk",
]
# Overture Maps data source (gbx.sample.overture): static-STAC catalog traversal.
# pystac is the static-catalog reader; geopandas/pyarrow (in [light]) do parquet read.
overture = [
    "pystac>=1.9,<2",
    "overturemaps>=0.13",
]
# STAC catalog client (lightweight): distributed search + resilient download + repair.
# Optional extra so [light] users who don't need STAC don't pull pystac/planetary-computer.
stac = [
    "pystac-client>=0.7,<1",
    "planetary-computer>=1.0,<2",
    "tenacity>=8,<10",
    "requests>=2.25",
    # NASA EMIT (CH4) fetch for the sample EmitDownloader — Earthdata-Login
    # authenticated (earthaccess), used by the vapor-eyes series. Lives here with
    # the other remote-data-acquisition clients (not base [light]).
    "earthaccess>=0.11,<1",
    # Cap the transitive botocore (earthaccess -> s3fs -> aiobotocore -> botocore)
    # to keep [stac] versionless across all supported bases. The ceiling <1.41.0
    # is the least-forcing constraint that spans every supported runtime:
    #   env 6 / DBR 18 / DBR 19  — base botocore 1.40.45–1.40.46 (boto3 1.40.x)
    #   DBR 17.3                  — base botocore 1.36.3 (boto3 1.36.2)
    #   Serverless env 5          — base botocore unconfirmed, likely 1.40.x
    # On boto3-1.40.x bases the floor >=1.40.45 is already enforced by boto3's
    # OWN dependency declaration, so <1.41.0 alone yields >=1.40.45 there — no
    # behavior change. On older-boto3 bases (DBR 17.3) the removed floor no longer
    # forces botocore above what the pre-installed boto3 allows. We don't use
    # boto3/S3 at runtime (earthaccess fetches over HTTPS) — this silences the
    # pip resolver clash. Note: [stac] + DBR 17.3 is not yet cluster-verified;
    # env 6, DBR 18, and DBR 19 are confirmed compatible.
    "botocore<1.41.0",
]
# Visualization helpers (gbx.vizx): matplotlib raster rendering + geopandas map
# adapters, interactive MapLibre GL viewer (anywidget), and tippecanoe-based
# tile simplification.  Optional so [light] users who don't visualize don't
# pull the GUI stack.  Package code imports only matplotlib + geopandas at
# module level; anywidget, tippecanoe, and mapclassify are optional at call time.
vizx = [
    "matplotlib>=3.7,<4",
    "geopandas>=1.0,<2",
    "mapclassify>=2.6,<3",
    "contextily>=1.5,<2",
    "anywidget>=0.9,<1",
    "tippecanoe>=2.45,<3",
]

[tool.coverage.run]
# Exclude sample-data bundle from coverage total so reported % reflects main library (gridx, rasterx, vectorx)
# Multiple patterns ensure exclusion when paths are relative (src/...) or absolute; required for CI and local.
omit = [
    "*sample/_bundle.py",
    "*_bundle.py",
    "src/databricks/labs/gbx/sample/_bundle.py",
    "databricks/labs/gbx/sample/_bundle.py",
    "python/geobrix/src/databricks/labs/gbx/sample/_bundle.py",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]

[tool.pytest.ini_options]
pythonpath = [ "src", "." ]
markers = [
    "integration: tests that need network or long-running setup (excluded from CI)",
]
filterwarnings = [
    "ignore:Support for class-based .* config.* deprecated:",
    "ignore:Neither gdal.UseExceptions:FutureWarning",
]

[build-system]
requires = ["setuptools>=61.2", "wheel"]

[tool.setuptools]
include-package-data = false

# databricks.labs.* must be PEP 420 namespace packages (no __init__.py at
# databricks/ or databricks/labs/) so they coexist with databricks-sdk /
# databricks-connect, which share the `databricks` namespace. find_namespace
# discovery includes the gbx subpackages without those shadowing __init__ files.
[tool.setuptools.packages.find]
where = ["src"]
# Only the gbx subtree is a real package; databricks/ and databricks/labs/ stay
# pure PEP 420 namespace dirs (no __init__.py, not listed) so setuptools doesn't
# synthesize empty __init__.py for them in the wheel (which would re-shadow
# databricks-sdk). namespaces=true keeps PEP 420 discovery for the subtree.
include = ["databricks.labs.gbx*"]
namespaces = true

[tool.setuptools.package-data]
geobrix = ["lib/*.jar", "resources/*.png"]
# Ship the canonical registered-function list inside the bench package so the heavy
# vs light comparison (spec.registered_rst) works when installed without the repo
# tree (e.g. the wheel on a cluster). Kept in sync with the canonical
# docs/tests-function-info/registered_functions.txt by check-binding-parity.py.
"databricks.labs.gbx.bench" = ["registered_functions.txt"]

[tool.setuptools.dynamic]
version = {attr = "databricks.labs.gbx.__version__"}

[tool.black]
line-length = 88
target-version = ["py310", "py312"]
include = '\.pyi?$'
extend-exclude = '/(\.git|__pycache__|dist)/'

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88
known_first_party = ["databricks"]
default_section = "THIRDPARTY"

[tool.flake8]
# E203/E704/W503 are the standard black-compatibility exclusions (black emits
# one-line `def f(): ...` stubs for Protocol methods, which trip E704).
ignore = ["E203", "E266", "E501", "E704", "W503"]
max-line-length = 88
max-complexity = 20
select = ["B", "C", "E", "F", "W", "T4"]
exclude = [".git", "__pycache__", "docs/conf.py", "dist"]
