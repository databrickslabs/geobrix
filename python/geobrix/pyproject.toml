[project]
name = "geobrix"
authors = [
    { name = "Michael Johns" },
    { name = "Stuart Lynn" },
    { email = "labs@databricks.com"}
]
dynamic = ["version"]
description = "GeoBriX: A high-performance spatial processing library for Apache Spark."
readme = "README.md"
requires-python = ">=3.10, <3.13"

# PEP 639 SPDX expression form. setuptools >=77 deprecated the table form
# (`{ text = ... }` / `{ file = ... }`) and warns on every build by 2027-Feb-18.
# Proprietary licenses use the `LicenseRef-<id>` namespace per PEP 639;
# canonical license text lives in ../../LICENSE at the repo root.
license = "LicenseRef-Databricks-Proprietary"
classifiers = [
    # PEP 639: License classifiers are forbidden once `project.license` is a SPDX
    # expression — setuptools >=77 raises InvalidConfigError on overlap.
    # The license is expressed above via `license = "LicenseRef-Databricks-Proprietary"`.
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    'Operating System :: OS Independent'
]
dependencies = [
    "pyspark>=4.0.0",
]

[project.urls]
Homepage = "https://databricks.com/learn/labs"
Repository = "https://github.com/databrickslabs/geobrix"
Documentation = "https://databrickslabs.github.io/geobrix/"

[project.optional-dependencies]
dev = [
    # Lint toolchain — pins MUST match python/geobrix/requirements-ci.in so that
    # `gbx:lint:python --fix` (host .venv) produces byte-identical output to CI and
    # to the dev container's `--check`. Unpinned here previously let the .venv resolve
    # to newer black/isort than CI, so host-formatted files failed CI's black --check.
    # When bumping requirements-ci.in, bump these in the same commit.
    "isort==8.0.1",
    "black==26.3.1",
    "flake8==7.3.0",
    "flake8-pyproject==1.2.4",
    "build==1.4.4",
]
test = [
    "pytest>=7.0",
    "shapely>=2.1.0",
    "rasterio>=1.3.0",
    "numpy>=1.24.0",
    # pyvx (light VectorX / MVT) tests use mapbox-vector-tile as the decode
    # oracle. Pinned to 2.1.x — see the [light_dbr17] extra for why (protobuf <6
    # on classic DBR 17.3/18; [light] itself is now Serverless-v6/protobuf-6).
    # 2.1.0 still has the 2.x native-typed-attribute encode API.
    "mapbox-vector-tile>=2.1,<2.2",
]
# Internal composition extra — NOT for direct user installation.
# Intentionally named `light-base` (not `light`) to distinguish it from user-
# facing extras. pip has no mechanism to mark an extra as private; contributors
# must treat it as a build-time composition tool. Install geobrix[light]
# (current Serverless, env v6) or geobrix[light_dbr17/18/19] for classic clusters.
light-base = [
    "rasterio>=1.3.0",
    "shapely>=2.1.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=11.0.0",
    "scipy>=1.11.0",
    "numexpr>=2.8.0",
    "rio-cogeo>=7.0,<8",
    "h3>=4.0,<5",
    "quadbin>=0.2,<0.3",
    # Protomaps PMTiles archive writer/reader (pure-Python) for the pmtiles_gbx
    # tiled-output backend. Writer needs ascending tileid; Reader used in tests.
    "pmtiles>=3.4,<4",
    # OGR-free vector reading for the light *_gbx vector DataSources. pyogrio
    # bundles its own libgdal; pyproj (pulled by pyogrio) maps CRS->srid/proj4.
    "pyogrio>=0.12,<1",
    # Cap pyproj: a floor-only, native-PROJ-tied dep that floats to "latest" on
    # Serverless (not held by the immutable base) — same float-and-break risk as
    # rio-tiler 9.3.0. No 4.x exists yet, so <4 is a no-op today but future-proofs.
    "pyproj>=3.6,<4",
    # Functional floor only; the protobuf-5 cap (light_dbr17/18) and uncapped
    # (light, light_dbr19) forms live in the per-env variant deltas below.
    "mapbox-vector-tile>=2.1",
    "scikit-image>=0.22,<1",
    "xarray-spatial>=0.4,<1",
    # NetCDF decode for the netcdf_gbx reader. xarray is already pulled by
    # xarray-spatial; netcdf4 is the one new engine — a single wheel bundling
    # netcdf-c + HDF5, reading both NetCDF-3 and NetCDF-4/HDF5 (S5P, ERA5).
    # Folded into [light-base] (not a separate [netcdf] extra) so geobrix[light]
    # reads NetCDF out of the box. Floor pinned; add a ceiling if a future
    # release floats/breaks on current Serverless (Py 3.12), same discipline as
    # the rio-tiler / mapbox-vector-tile pins above.
    "netcdf4>=1.6,<2",
    # Entity-hardened XML parsing for external-origin GDAL .vrt mosaic indexes
    # (raster_gbx VRT expansion). The stdlib xml.etree parser is vulnerable to
    # XXE / billion-laughs on an untrusted .vrt; defusedxml is the safe parser
    # _parse_vrt_members prefers. Dep-free, pure Python. Floor pinned; <1
    # future-proofs (no 1.x exists today).
    "defusedxml>=0.7,<1",
]
# Runtime deps for the lightweight pure-Python/PySpark APIs (no JAR) — tracks the
# current Databricks Serverless environment. `light` = env v6 for the 0.5.0 release;
# advance this per release. Classic clusters use geobrix[light_dbr17/18/19] instead.
# pandas + pyarrow are required by pyspark pandas_udf (Arrow batch serialization);
# base pyspark does NOT pull them, so without these the rst_* wrappers fail to
# import (_udf.py imports pandas) / at first invocation with a cryptic ImportError.
light = [
    "geobrix[light-base]",
    # `light` = the CURRENT Databricks Serverless environment (v6 for the 0.5.0
    # release). Serverless offers only one current env; we advance this per release.
    # v6 base is protobuf-6 (grpcio-status>=... requires protobuf>=6.31.1) and
    # Python 3.12. Classic clusters use light_dbr17/18/19 instead.
    "typing_extensions>=4.13",
    # rio-tiler 9.3.0 regressed a PEP 728 TypedDict import on Python 3.12; Serverless
    # v6 is still py3.12, so keep the <9.3 cap (revisit when a fixed 9.3.x ships).
    "rio-tiler>=9.0,<9.3",
    "httpcore>=1.0.9",
    # v6 base idna is 3.11; cap <3.12 to keep the base and silence the
    # "a core package changed: idna" notebook notice.
    "idna<3.12",
    # v6 base has protobuf-6, so mapbox-vector-tile 2.2 (needs protobuf>=6.31.1)
    # installs cleanly; require >=2.2 (drop the protobuf-5-era <2.2 cap).
    "mapbox-vector-tile>=2.2",
]
# Classic DBR 19 variant: protobuf-6 aligned with the new [light] (Serverless v6).
# The only structural delta from [light] is the optional rio-tiler cap relaxation
# (<9.4 vs <9.3 on Serverless); the 9.3.x typing regression was confirmed on
# Serverless/py3.12 — unverified on DBR 19. idna cap mirrors [light] at <3.12
# because light_dbr19 also runs on dogfood Serverless env v6, where the cap
# silences the "core package changed: idna" notice.
light_dbr19 = [
    "geobrix[light-base]",
    # --- Classic DBR 19 runtime-sensitive pins ---
    "typing_extensions>=4.13",  # DBR 19 certainly ships 4.13+; floor harmless
    # OPTIONAL: relaxed from <9.3 to <9.4; the 9.3.x typing regression is a
    # Serverless/Python 3.12 issue — unverified on DBR 19. Apply only if Task 6
    # confirms rio-tiler 9.3.x imports cleanly on DBR 19 Python 3.12; revert
    # to <9.3 here if validation fails (conservative fallback, OQ2).
    "rio-tiler>=9.0,<9.4",
    "httpcore>=1.0.9",          # DBR 19 ships >=1.0.9; floor harmless
    # idna cap: keep the dogfood serverless env-v6 base idna (3.11). idna is an
    # unbounded transitive dep (requests/anyio/httpx); uncapped, pip floats it to
    # the latest (3.19), which shadows the env base and fires the "a core package
    # changed: idna" notebook notice on dogfood serverless. Nothing needs the newer
    # idna, so cap it (mirrors [light]'s idna<3.12 for env v6). Confirmed 2026-08-23:
    # light_dbr19 runs on dogfood SERVERLESS env v6, not only classic — the notice
    # DOES apply there. idna 3.x is API-stable so this is cosmetic (silences the notice).
    "idna<3.12",
    # Protobuf-6 floor, consistent with DBR 19 base and the new [light] (v6).
    "mapbox-vector-tile>=2.2",
]
# Classic DBR 17.3 (protobuf-5 base). This is the profile `light` had before 0.5.0.
light_dbr17 = [
    "geobrix[light-base]",
    "typing_extensions>=4.13",
    "rio-tiler>=9.0,<9.3",
    "httpcore>=1.0.9",
    "idna<3.8",                     # DBR 17/18 protobuf-5 base idna 3.7
    "mapbox-vector-tile>=2.1,<2.2", # protobuf-5 cap (2.2 would pull protobuf 6)
]
# Classic DBR 18 — identical package set to DBR 17.3; kept as an explicit,
# documented name (aliases light_dbr17).
light_dbr18 = ["geobrix[light_dbr17]"]
# Feature-complete umbrella for the current Serverless environment (env v6 for
# 0.5.0). Installs [light] + all optional feature extras ([stac], [vizx], [overture]).
# [databricks] is NOT included — it is a Databricks SDK integration, not a geo
# feature, and Databricks compute already provides its runtime.
# Use this for the "don't reason about deps" full install on Serverless.
light_all = [
    "geobrix[light]",
    "geobrix[stac]",
    "geobrix[vizx]",
    "geobrix[overture]",
]
# Feature-complete umbrella for classic DBR 17.3 (protobuf-5). Same as [light_all]
# but uses [light_dbr17] so the protobuf constraint is DBR-17-correct.
# [databricks] excluded for the same reason as [light_all].
light_dbr17_all = [
    "geobrix[light_dbr17]",
    "geobrix[stac]",
    "geobrix[vizx]",
    "geobrix[overture]",
]
# Feature-complete umbrella for classic DBR 18. Aliases [light_dbr17_all] via
# [light_dbr18] — identical package set to DBR 17.3.
# [databricks] excluded for the same reason as [light_all].
light_dbr18_all = [
    "geobrix[light_dbr18]",
    "geobrix[stac]",
    "geobrix[vizx]",
    "geobrix[overture]",
]
# Feature-complete umbrella for classic DBR 19. Same as [light_all] but uses
# [light_dbr19] so the protobuf constraint is DBR-19-correct.
# [databricks] excluded for the same reason as [light_all].
light_dbr19_all = [
    "geobrix[light_dbr19]",
    "geobrix[stac]",
    "geobrix[vizx]",
    "geobrix[overture]",
]
# For sample-data bundle uploads to Unity Catalog Volumes and gbx:test:bundle-databricks
databricks = [
    "databricks-sdk",
]
# Overture Maps data source (gbx.sample.overture): static-STAC catalog traversal.
# pystac is the static-catalog reader; geopandas/pyarrow (in [light]) do parquet read.
overture = [
    "pystac>=1.9,<2",
    "overturemaps>=0.13",
]
# STAC catalog client (lightweight): distributed search + resilient download + repair.
# Optional extra so [light] users who don't need STAC don't pull pystac/planetary-computer.
stac = [
    "pystac-client>=0.7,<1",
    "planetary-computer>=1.0,<2",
    "tenacity>=8,<10",
    "requests>=2.25",
    # NASA EMIT (CH4) fetch for the sample EmitDownloader — Earthdata-Login
    # authenticated (earthaccess), used by the vapor-eyes series. Lives here with
    # the other remote-data-acquisition clients (not base [light]).
    "earthaccess>=0.11,<1",
    # Constrain the transitive botocore (earthaccess -> s3fs -> aiobotocore ->
    # botocore) to the Databricks Serverless base image's boto3 range, so
    # installing [stac] doesn't upgrade botocore past what the base boto3 allows
    # (boto3 1.40.x requires botocore <1.41,>=1.40.45). Keeps aiobotocore on 2.x;
    # s3fs/fsspec/earthaccess are unaffected. We don't use boto3/S3 at runtime
    # (earthaccess fetches over HTTPS) — this just silences the pip resolver clash.
    "botocore>=1.40.45,<1.41.0",
]
# Visualization helpers (gbx.vizx): matplotlib raster rendering + geopandas map
# adapters, interactive MapLibre GL viewer (anywidget), and tippecanoe-based
# tile simplification.  Optional so [light] users who don't visualize don't
# pull the GUI stack.  Package code imports only matplotlib + geopandas at
# module level; anywidget, tippecanoe, and mapclassify are optional at call time.
vizx = [
    "matplotlib>=3.7,<4",
    "geopandas>=1.0,<2",
    "mapclassify>=2.6,<3",
    "contextily>=1.5,<2",
    "anywidget>=0.9,<1",
    "tippecanoe>=2.45,<3",
]

[tool.coverage.run]
# Exclude sample-data bundle from coverage total so reported % reflects main library (gridx, rasterx, vectorx)
# Multiple patterns ensure exclusion when paths are relative (src/...) or absolute; required for CI and local.
omit = [
    "*sample/_bundle.py",
    "*_bundle.py",
    "src/databricks/labs/gbx/sample/_bundle.py",
    "databricks/labs/gbx/sample/_bundle.py",
    "python/geobrix/src/databricks/labs/gbx/sample/_bundle.py",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]

[tool.pytest.ini_options]
pythonpath = [ "src", "." ]
markers = [
    "integration: tests that need network or long-running setup (excluded from CI)",
]
filterwarnings = [
    "ignore:Support for class-based .* config.* deprecated:",
    "ignore:Neither gdal.UseExceptions:FutureWarning",
]

[build-system]
requires = ["setuptools>=61.2", "wheel"]

[tool.setuptools]
include-package-data = false

# databricks.labs.* must be PEP 420 namespace packages (no __init__.py at
# databricks/ or databricks/labs/) so they coexist with databricks-sdk /
# databricks-connect, which share the `databricks` namespace. find_namespace
# discovery includes the gbx subpackages without those shadowing __init__ files.
[tool.setuptools.packages.find]
where = ["src"]
# Only the gbx subtree is a real package; databricks/ and databricks/labs/ stay
# pure PEP 420 namespace dirs (no __init__.py, not listed) so setuptools doesn't
# synthesize empty __init__.py for them in the wheel (which would re-shadow
# databricks-sdk). namespaces=true keeps PEP 420 discovery for the subtree.
include = ["databricks.labs.gbx*"]
namespaces = true

[tool.setuptools.package-data]
geobrix = ["lib/*.jar", "resources/*.png"]
# Ship the canonical registered-function list inside the bench package so the heavy
# vs light comparison (spec.registered_rst) works when installed without the repo
# tree (e.g. the wheel on a cluster). Kept in sync with the canonical
# docs/tests-function-info/registered_functions.txt by check-binding-parity.py.
"databricks.labs.gbx.bench" = ["registered_functions.txt"]

[tool.setuptools.dynamic]
version = {attr = "databricks.labs.gbx.__version__"}

[tool.black]
line-length = 88
target-version = ["py310", "py312"]
include = '\.pyi?$'
extend-exclude = '/(\.git|__pycache__|dist)/'

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88
known_first_party = ["databricks"]
default_section = "THIRDPARTY"

[tool.flake8]
# E203/E704/W503 are the standard black-compatibility exclusions (black emits
# one-line `def f(): ...` stubs for Protocol methods, which trip E704).
ignore = ["E203", "E266", "E501", "E704", "W503"]
max-line-length = 88
max-complexity = 20
select = ["B", "C", "E", "F", "W", "T4"]
exclude = [".git", "__pycache__", "docs/conf.py", "dist"]
