e, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#1F6FB5">h3_longlatash3 · coarsen or refine</text></g><text x="1102.0" y="526" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#3F4D5E">Query bins raw well coordinates with h3_longlatash3 at the chosen resolution, so it can refine finer as</text><text x="1102.0" y="542" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#3F4D5E">you zoom in — as well as coarsen when the view is crowded.</text>
