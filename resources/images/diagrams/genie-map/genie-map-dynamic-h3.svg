<rect x="36" y="40" rx="14" ry="14" width="60" height="60" fill="#6B4FA0"/><text x="66.0" y="79.0" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">GM</text><text x="114" y="68" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="28" font-weight="800" fill="#0F1B2A" text-anchor="start">Density-aware dynamic H3 resolution</text><text x="114" y="94" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" font-weight="400" fill="#3F4D5E" text-anchor="start">Zoom sets a ceiling; density lowers it; cell-sourced coarsens, point-sourced refines</text><rect x="1262" y="48" rx="13" ry="13" width="182" height="26" fill="#0F1B2A"/><text x="1353.0" y="66" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Genie Map  ·  Dynamic H3</text>
<text x="36" y="186" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#7A8794" text-anchor="start" letter-spacing="1.4">ZOOM SETS A CEILING</text><line x1="120.0" y1="210.0" x2="1351.0" y2="210.0" stroke="#1F6FB5" stroke-width="3" stroke-linecap="round"/><polygon points="1360.0,210.0 1351.0,215.0 1351.0,205.0" fill="#1F6FB5"/><text x="120" y="236" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#3F4D5E" text-anchor="start">zoomed out</text><text x="1360" y="236" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#3F4D5E" text-anchor="end">zoomed in</text><circle cx="269" cy="210" r="6" fill="#1F6FB5"/><text x="268.79999999999995" y="194" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F6FB5" text-anchor="middle">res 4</text><circle cx="579" cy="210" r="6" fill="#1F6FB5"/><text x="578.8" y="194" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F6FB5" text-anchor="middle">res 5</text><circle cx="889" cy="210" r="6" fill="#1F6FB5"/><text x="888.8" y="194" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F6FB5" text-anchor="middle">res 6</text><circle cx="1199" cy="210" r="6" fill="#1F6FB5"/><text x="1198.8" y="194" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F6FB5" text-anchor="middle">res 7</text><rect x="36" y="262" rx="12" ry="12" width="1408" height="52" fill="#FADCE6" stroke="#C2255C" stroke-width="1.4"/><text x="58" y="286" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#C2255C" text-anchor="start" letter-spacing="1.0">DENSITY LOWERS IT ONLY WHEN CROWDED</text><text x="58" y="304" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#3F4D5E" text-anchor="start">If in-view cells exceed the target (~300), coarsen further by floor(log₇(count / target)) H3 parent steps. Sparse data stays at the ceiling.</text><rect x="36" y="340" rx="12" ry="12" width="684.0" height="262" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#card-shadow)"/><path d="M 36 352 A 12 12 0 0 1 48 340 H 708.0 A 12 12 0 0 1 720.0 352 V 345 H 36 Z" fill="#0F8E8B"/><polygon points="344.2,356.5 366.7,369.5 366.7,395.5 344.2,408.5 321.7,395.5 321.7,369.5" fill="#D5ECEC" fill-opacity="0.85" stroke="#0F8E8B" stroke-width="1.6"/><polygon points="389.3,356.5 411.8,369.5 411.8,395.5 389.3,408.5 366.7,395.5 366.7,369.5" fill="#D5ECEC" fill-opacity="0.85" stroke="#0F8E8B" stroke-width="1.6"/><polygon points="366.7,395.5 389.3,408.5 389.3,434.5 366.7,447.5 344.2,434.5 344.2,408.5" fill="#D5ECEC" fill-opacity="0.85" stroke="#0F8E8B" stroke-width="1.6"/><polygon points="411.8,395.5 434.3,408.5 434.3,434.5 411.8,447.5 389.3,434.5 389.3,408.5" fill="#0F8E8B" fill-opacity="1.0" stroke="#0F8E8B" stroke-width="1.6"/><text x="378.0" y="472" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="17" font-weight="800" fill="#0F1B2A" text-anchor="middle">Cell-sourced  ·  ch4_hotspots</text><g transform="translate(275.0, 484)"><rect x="0" y="0" rx="11" ry="11" width="206" height="22" fill="#D5ECEC"/><text x="103.0" y="15.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#0F8E8B">h3_toparent · coarsen only</text></g><text x="378.0" y="526" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#3F4D5E">Gold MV stores cells at the satellite's native resolution. Coarsen with h3_toparent when dense — but</text><text x="378.0" y="542" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#3F4D5E">capped at native res, so it never invents precision the instrument lacks.</text><rect x="760.0" y="340" rx="12" ry="12" width="684.0" height="262" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#card-shadow)"/><path d="M 760.0 352 A 12 12 0 0 1 772.0 340 H 1432.0 A 12 12 0 0 1 1444.0 352 V 345 H 760.0 Z" fill="#1F6FB5"/><polygon points="1011.1,325.0 1023.2,332.0 1023.2,346.0 1011.1,353.0 998.9,346.0 998.9,332.0" fill="#E3EEF8" fill-opacity="0.85" stroke="#1F6FB5" stroke-width="1.6"/><polygon points="1035.3,325.0 1047.4,332.0 1047.4,346.0 1035.3,353.0 1023.2,346.0 1023.2,332.0" fill="#E3EEF8" fill-opacity="0.85" stroke="#1F6FB5" stroke-width="1.6"/><polygon points="1059.6,325.0 1071.7,332.0 1071.7,346.0 1059.6,353.0 1047.4,346.0 1047.4,332.0" fill="#E3EEF8" fill-opacity="0.85" stroke="#1F6FB5" stroke-width="1.6"/><polygon points="1083.8,325.0 1095.9,332.0 1095.9,346.0 1083.8,353.0 1071.7,346.0 1071.7,332.0" fill="#E3EEF8" fill-opacity="0.85" stroke="#1F6FB5" stroke-width="1.6"/><polygon points="1108.1,325.0 1120.2,332.0 1120.2,346.0 1108.1,353.0 1095.9,346.0 1095.9,332.0" fill="#E3EEF8" fill-opacity="0.85" stroke="#1F6FB5" stroke-width="1.6"/><polygon points="1132.3,325.0 1144.4,332.0 1144.4,346.0 1132.3,353.0 1120.2,346.0 1120.2,332.0" fill="#E3EEF8" fill-opacity="0.85" stroke="#1F6FB5" stroke-width="1.6"/><polygon points="1156.6,325.0 1168.7,332.0 1168.7,346.0 1156.6,353.0 1144.4,346.0 1144.4,332.0" fill="#E3EEF8" fill-opacity="0.85" stroke="#1F6FB5" stroke-width="1.6"/><polygon points="1180.8,325.0 1192.9,332.0 1192.9,346.0 1180.8,353.0 1168.7,346.0 1168.7,332.0" fill="#E3EEF8" fill-opacity="0.85" stroke="#1F6FB5" stroke-width="1.6"/><polygon points="1023.2,346.0 1035.3,353.0 1035.3,367.0 1023.2,374.0 1011.1,367.0 1011.1,353.0" fill="#E3EEF8" fill-opacity="0.85" stroke="#1F6FB5" stroke-width="1.6"/><polygon points="1047.4,346.0 1059.6,353.0 1059.6,367.0 1047.4,374.0 1035.3,367.0 1035.3,353.0" fill="#E3EEF8" fill-opacity="0.85" stroke="#1F6FB5" stroke-width="1.6"/><polygon points="1071.7,346.0 1083.8,353.0 1083.8,367.0 1071.7,374.0 1059.6,367.0 1059.6,35