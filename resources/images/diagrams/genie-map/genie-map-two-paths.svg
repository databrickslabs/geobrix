<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 720" width="1480" height="720" style="font-family: Inter, -apple-system, system-ui, sans-serif;">
<defs><filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0F1B2A" flood-opacity="0.08"/></filter><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAFBFC"/><stop offset="1" stop-color="#F1F4F8"/></linearGradient></defs>
<rect x="0" y="0" width="1480" height="720" fill="url(#bg)"/>
<rect x="36" y="40" rx="14" ry="14" width="60" height="60" fill="#1F6FB5"/><text x="66.0" y="79.0" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">GM</text><text x="114" y="68" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="28" font-weight="800" fill="#0F1B2A" text-anchor="start">Two ways to put geometry on the map</text><text x="114" y="94" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" font-weight="400" fill="#3F4D5E" text-anchor="start">A deterministic viewport path and a natural-language path, side by side</text><rect x="1269" y="48" rx="13" ry="13" width="175" height="26" fill="#0F1B2A"/><text x="1356.5" y="66" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Genie Map  ·  Two Paths</text>
<rect x="54" y="168" rx="16" ry="16" width="660" height="448" fill="#E3EEF8" fill-opacity="0.35" stroke="#1F6FB5" stroke-width="1.4"/><rect x="54" y="168" rx="16" ry="16" width="660" height="46" fill="#1F6FB5"/><rect x="54" y="194" width="660" height="20" fill="#1F6FB5"/><text x="384.0" y="197" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Deterministic viewport path</text><rect x="114.0" y="236.0" rx="12" ry="12" width="540" height="92.66666666666667" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#card-shadow)"/><path d="M 114.0 248.0 A 12 12 0 0 1 126.0 236.0 H 642.0 A 12 12 0 0 1 654.0 248.0 V 241.0 H 114.0 Z" fill="#1F6FB5"/><text x="384.0" y="260.0" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F1B2A" text-anchor="middle">Map move</text><text x="384.0" y="282.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#3F4D5E">The user pans or zooms; the client captures the new viewport bounds and zoom</text><rect x="114.0" y="350.6666666666667" rx="12" ry="12" width="540" height="92.66666666666667" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#card-shadow)"/><path d="M 114.0 362.6666666666667 A 12 12 0 0 1 126.0 350.6666666666667 H 642.0 A 12 12 0 0 1 654.0 362.6666666666667 V 355.6666666666667 H 114.0 Z" fill="#1F6FB5"/><text x="384.0" y="374.6666666666667" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F1B2A" text-anchor="middle">Parameterized Spark SQL</text><text x="384.0" y="396.6666666666667" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#3F4D5E">One templated query per layer, bound to the bbox and a zoom-and-density</text><text x="384.0" y="412.6666666666667" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#3F4D5E">resolution</text><rect x="114.0" y="465.33333333333337" rx="12" ry="12" width="540" height="92.66666666666667" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#card-shadow)"/><path d="M 114.0 477.33333333333337 A 12 12 0 0 1 126.0 465.33333333333337 H 642.0 A 12 12 0 0 1 654.0 477.33333333333337 V 470.33333333333337 H 114.0 Z" fill="#1F6FB5"/><text x="384.0" y="489.33333333333337" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F1B2A" text-anchor="middle">H3 cells + point layers</text><text x="384.0" y="511.33333333333337" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#3F4D5E">Hexagon and point layers render straight from the returned rows — no geometry</text><text x="384.0" y="527.3333333333334" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#3F4D5E">round-trip</text><line x1="384.0" y1="331.7" x2="384.0" y2="338.7" stroke="#1F6FB5" stroke-width="2.4" stroke-linecap="round"/><polygon points="384.0,347.7 379.0,338.7 389.0,338.7" fill="#1F6FB5"/><line x1="384.0" y1="446.3" x2="384.0" y2="453.3" stroke="#1F6FB5" stroke-width="2.4" stroke-linecap="round"/><polygon points="384.0,462.3 379.0,453.3 389.0,453.3" fill="#1F6FB5"/><text x="84" y="578" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1F6FB5" text-anchor="start">Good for: Precise, repeatable, instant on every pan and zoom</text><rect x="766" y="168" rx="16" ry="16" width="660" height="448" fill="#EDE8F5" fill-opacity="0.35" stroke="#6B4FA0" stroke-width="1.4"/><rect x="766" y="168" rx="16" ry="16" width="660" height="46" fill="#6B4FA0"/><rect x="766" y="194" width="660" height="20" fill="#6B4FA0"/><text x="1096.0" y="197" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Natural-language path</text><rect x="826.0" y="236.0" rx="12" ry="12" width="540" height="64.0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#card-shadow)"/><path d="M 826.0 248.0 A 12 12 0 0 1 838.0 236.0 H 1354.0 A 12 12 0 0 1 1366.0 248.0 V 241.0 H 826.0 Z" fill="#6B4FA0"/><text x="1096.0" y="260.0" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F1B2A" text-anchor="middle">Question</text><text x="1096.0" y="282.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#3F4D5E">“Which operators sit nearest the strongest plumes?” — typed in the assistant</text><text x="1096.0" y="298.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#3F4D5E">panel</text><rect x="826.0" y="322.0" rx="12" ry="12" width="540" height="64.0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#card-shadow)"/><path d="M 826.0 334.0 A 12 12 0 0 1 838.0 322.0 H 1354.0 A 12 12 0 0 1 1366.0 334.0 V 327.0 H 826.0 Z" fill="#6B4FA0"/><text x="1096.0" y="346.0" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F1B2A" text-anchor="middle">Genie Space</text><text x="1096.0" y="368.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#3F4D5E">Genie plans SQL over the curated gold tables and returns a result set</text><rect x="826.0" y="408.0" rx="12" ry="12" width="540" height="64.0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#card-shadow)"/><path d="M 826.0 420.0 A 12 12 0 0 1 838.0 408.0 H 1354.0 A 12 12 0 0 1 1366.0 420.0 V 413.0 H 826.0 Z" fill="#6B4FA0"/><text x="1096.0" y="432.0" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F1B2A" text-anchor="middle">Geometry answer</text><text x="1096.0" y="454.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#3F4D5E">A column aliased *_geojson (ST_ASGEOJSON) is recognized as drawable geometry</text><rect x="826.0" y="494.0" rx="12" ry="12" width="540" height="64.0" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#card-shadow)"/><path d="M 826.0 506.0 A 12 12 0 0 1 838.0 494.0 H 1354.0 A 12 12 0 0 1 1366.0 506.0 V 499.0 H 826.0 Z" fill="#6B4FA0"/><text x="1096.0" y="518.0" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F1B2A" text-anchor="middle">Rendered layer</text><text x="1096.0" y="540.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#3F4D5E">The answer becomes a map layer alongside the deterministic ones</text><line x1="1096.0" y1="303.0" x2="1096.0" y2="310.0" stroke="#6B4FA0" stroke-width="2.4" stroke-linecap="round"/><polygon points="1096.0,319.0 1091.0,310.0 1101.0,310.0" fill="#6B4FA0"/><line x1="1096.0" y1="389.0" x2="1096.0" y2="396.0" stroke="#6B4FA0" stroke-width="2.4" stroke-linecap="round"/><polygon points="1096.0,405.0 1091.0,396.0 1101.0,396.0" fill="#6B4FA0"/><line x1="1096.0" y1="475.0" x2="1096.0" y2="482.0" stroke="#6B4FA0" stroke-width="2.4" stroke-linecap="round"/><polygon points="1096.0,491.0 1091.0,482.0 1101.0,482.0" fill="#6B4FA0"/><text x="796" y="578" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#6B4FA0" text-anchor="start">Good for: Exploratory — answers ad-hoc questions the templates never anticipated</text>
<text x="36" y="650" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="10" font-weight="700" fill="#7A8794" text-anchor="start" letter-spacing="1.6">KEY FUNCTIONS</text><rect x="166" y="640" rx="12" ry="12" width="108" height="24" fill="#E3EEF8"/><text x="220.0" y="656.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#1F6FB5">useLayerData</text><rect x="282" y="640" rx="12" ry="12" width="143" height="24" fill="#E3EEF8"/><text x="353.5" y="656.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#1F6FB5">parameterized SQL</text><rect x="433" y="640" rx="12" ry="12" width="122" height="24" fill="#E3EEF8"/><text x="494.0" y="656.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#1F6FB5">h3_longlatash3</text><rect x="563" y="640" rx="12" ry="12" width="59" height="24" fill="#E3EEF8"/><text x="592.5" y="656.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#1F6FB5">Genie</text><rect x="630" y="640" rx="12" ry="12" width="108" height="24" fill="#E3EEF8"/><text x="684.0" y="656.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#1F6FB5">ST_ASGEOJSON</text><text x="1444" y="650" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="400" fill="#7A8794" text-anchor="end">databrickslabs/geobrix  ·  Genie Map  ·  geospatial_docs.vapor_eyes_lf</text>
</svg>