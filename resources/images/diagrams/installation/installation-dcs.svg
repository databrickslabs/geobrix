ke="#7A8794" stroke-width="1.2" stroke-dasharray="6 5"/><text x="1054" y="490" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#5A6878" text-anchor="start" letter-spacing="1.2">NOT AVAILABLE YET</text><text x="1054" y="510" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#3F4D5E" text-anchor="start">Standard access mode (Beta): lightweight functions work;</text><text x="1054" y="525" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#3F4D5E" text-anchor="start">Python DataSource readers and the heavyweight tier are not</text><text x="1054" y="540" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#3F4D5E" text-anchor="start">available yet.</text><text x="1054" y="562" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#3F4D5E" text-anchor="start">Serverless: DCS is not available on Serverless yet.</text><text x="1054" y="584" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#3F4D5E" text-anchor="start">x86 (amd64) images and DBR 17.3 / 18: not yet available.</text>
