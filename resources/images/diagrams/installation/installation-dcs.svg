hor="start">The one GeoBrix JAR; dedicated clusters load this directory</text><rect x="56" y="376" rx="9" ry="9" width="380" height="62" fill="#FCE9E2" stroke="#E04E2A" stroke-width="1.4"/><rect x="56" y="376" width="6" height="62" rx="3" ry="3" fill="#E04E2A"/><text x="76" y="402" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#0F1B2A" text-anchor="start">GDAL 3.11.4 + Java (JNI) bindings</text><text x="76" y="423" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#3F4D5E" text-anchor="start">Native GDAL the heavyweight JAR loads</text><rect x="56" y="447" rx="9" ry="9" width="380" height="62" fill="#D5ECEC" stroke="#0F8E8B" stroke-width="1.4"/><rect x="56" y="447" width="6" height="62" rx="3" ry="3" fill="#0F8E8B"/><text x="76" y="473" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#0F1B2A" text-anchor="start">databricksruntime/environment:v6-standard</text><text x="76" y="494" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#3F4D5E" text-anchor="start">DCS vNext base; Graviton uses the -arm variant</text><text x="540" y="142" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#7A8794" text-anchor="start" letter-spacing="1.4">2 · DEDICATED CLUSTER</text><rect x="536" y="150" rx="14" ry="14" width="420" height="388" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#card-shadow)"/><path d="M 536 164 A 14 14 0 0 1 550 150 H 942 A 14 14 0 0 1 956 164 V 155 H 536 Z" fill="#0F8E8B"/><text x="746.0" y="182" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="16" font-weight="800" fill="#0F1B2A" text-anchor="middle">Dedicated cluster</text><rect x="724.0" y="200" rx="4" ry="4" width="44" height="22" fill="#0F8E8B" fill-opacity="0.9" stroke="#0F8E8B" stroke-width="2"/><rect x="684.0" y="244" rx="4" ry="4" width="36" height="22" fill="#D5ECEC" stroke="#0F8E8B" stroke-width="2"/><line x1="746.0" y1="222" x2="702.0" y2="244" stroke="#0F8E8B" stroke-width="1.6" stroke-opacity="0.7"/><rect x="728.0" y="244" rx="4" ry="4" width="36" height="22" fill="#D5ECEC" stroke="#0F8E8B" stroke-width="2"/><line x1="746.0" y1="222" x2="746.0" y2="244" stroke="#0F8E8B" stroke-width="1.6" stroke-opacity="0.7"/><rect x="772.0" y="244" rx="4" ry="4" width="36" height="22" fill="#D5ECEC" stroke="#0F8E8B" stroke-width="2"/><line x1="746.0" y1="222" x2="790.0" y2="244" stroke="#0F8E8B" stroke-width="1.6" stroke-opacity="0.7"/><text x="562" y="300" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#7A8794" text-anchor="start" letter-spacing="1.2">ACCESS MODE</text><text x="562" y="319" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F1B2A" text-anchor="start">Dedicated  ·  DBR 19  ·  Graviton (arm64) or x86</text><text x="562" y="352" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#7A8794" text-anchor="start" letter-spacing="1.2">DOCKER IMAGE URL</text><text x="562" y="371" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F1B2A" text-anchor="start">The GeoBrix image tag for the instance architecture</text><text x="562" y="404" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#7A8794" text-anchor="start" letter-spacing="1.2">SPARK CONFIG</text><text x="562" y="423" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0F1B2A" text-anchor="start">spark.databricks.unityCatalog.volumes.enabled true</text><text x="562" y="456" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#7A8794" text-anchor="start" letter-spacing="1.2">INIT SCRIPT AND LIBRARIES</text><text x="562" y="475" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F1B2A" text-anchor="start">None: the image carries everything</text><rect x="536" y="556" rx="12" ry="12" width="420" height="52" fill="#FADCE6" stroke="#C2255C" stroke-width="1.4"/><text x="556" y="578" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#C2255C" text-anchor="start" letter-spacing="1.0">DON'T ATTACH THE JAR AS A LIBRARY</text><text x="556" y="597" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#0F1B2A" text-anchor="start">The image already has it: one GeoBrix JAR per cluster</text><line x1="462.0" y1="344.0" x2="521.0" y2="344.0" stroke="#0F8E8B" stroke-width="2.4" stroke-linecap="round"/><polygon points="530.0,344.0 521.0,349.0 521.0,339.0" fill="#0F8E8B"/><text x="496.0" y="332.0" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F8E8B" text-anchor="middle">image</text><text x="1040" y="142" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#7A8794" text-anchor="start" letter-spacing="1.4">3 · TIERS THAT RUN</text><rect x="1036" y="150" rx="14" ry="14" width="408" height="124" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#card-shadow)"/><path d="M 1036 164 A 14 14 0 0 1 1050 150 H 1430 A 14 14 0 0 1 1444 164 V 155 H 1036 Z" fill="#1F6FB5"/><circle cx="1070" cy="188" r="14" fill="#1F6FB5"/><path d="M 1063 188 L 1068 194 L 1078 182" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1094" y="194" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0F1B2A" text-anchor="start">Lightweight</text><text x="1060" y="226" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="400" fill="#0F1B2A" text-anchor="start">pyrx · pyvx · pygx and the *_gbx readers</text><text x="1060" y="252" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#5A6878" text-anchor="start">No %pip step: the wheel is in the image</text><rect x="1036" y="288" rx="14" ry="14" width="408" height="124" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#card-shadow)"/><path d="M 1036 302 A 14 14 0 0 1 1050 288 H 1430 A 14 14 0 0 1 1444 302 V 293 H 1036 Z" fill="#E04E2A"/><circle cx="1070" cy="326" r="14" fill="#E04E2A"/><path d="M 1063 326 L 1068 332 L 1078 320" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1094" y="332" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0F1B2A" text-anchor="start">Heavyweight</text><text x="1060" y="364" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="400" fill="#0F1B2A" text-anchor="start">rasterx · vectorx · gridx (gbx_* on the JVM)</text><text x="1060" y="390" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#5A6878" text-anchor="start">gdal and *_ogr readers read /Volumes directly</text><line x1="962.0" y1="212.0" x2="1021.0" y2="212.0" stroke="#1F6FB5" stroke-width="2.4" stroke-linecap="round"/><polygon points="1030.0,212.0 1021.0,217.0 1021.0,207.0" fill="#1F6FB5"/><line x1="962.0" y1="350.0" x2="1021.0" y2="350.0" stroke="#E04E2A" stroke-width="2.4" stroke-linecap="round"/><polygon points="1030.0,350.0 1021.0,355.0 1021.0,345.0" fill="#E04E2A"/><rect x="1036" y="426" rx="12" ry="12" width="408" height="112" fill="#F7F9FB" stroke="#7A8794" stroke-width="1.2" stroke-dasharray="6 5"/><text x="1054" y="450" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#5A6878" text-anchor="start" letter-spacing="1.2">OTHER COMPUTE</text><text x="1054" y="470" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#3F4D5E" text-anchor="start">DBR 17.3 / 18: no image yet; on x86 use the Init Script</text><text x="1054" y="485" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#3F4D5E" text-anchor="start">(Legacy).</text><text x="1054" y="509" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#3F4D5E" text-anchor="start">Standard access mode and Serverless: use WHL-only</text><text x="1054" y="524" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#3F4D5E" text-anchor="start">(Lightweight).</text>
