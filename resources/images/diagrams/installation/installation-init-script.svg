<text x="40" y="142" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#7A8794" text-anchor="start" letter-spacing="1.4">1 · STAGE ON A VOLUME</text><rect x="36" y="150" rx="14" ry="14" width="470" height="386" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#card-shadow)"/><path d="M 36 164 A 14 14 0 0 1 50 150 H 492 A 14 14 0 0 1 506 164 V 155 H 36 Z" fill="#6B4FA0"/><path d="M 61.6 179.5 V 204.5 A 18.4 5.9 0 0 0 98.4 204.5 V 179.5 Z" fill="#EDE8F5" stroke="#6B4FA0" stroke-width="2"/><ellipse cx="80.0" cy="179.5" rx="18.4" ry="5.9" fill="#EDE8F5" stroke="#6B4FA0" stroke-width="2"/><path d="M 61.6 190.0 A 18.4 5.9 0 0 0 98.4 190.0" fill="none" stroke="#6B4FA0" stroke-width="1.3" stroke-opacity="0.5"/><path d="M 61.6 197.5 A 18.4 5.9 0 0 0 98.4 197.5" fill="none" stroke="#6B4FA0" stroke-width="1.3" stroke-opacity="0.5"/><text x="112" y="188" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0F1B2A" text-anchor="start">VOL_DIR</text><text x="112" y="208" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#3F4D5E" text-anchor="start">An isolated Unity Catalog Volume folder</text><rect x="56" y="238" rx="9" ry="9" width="430" height="70" fill="#EDE8F5" stroke="#6B4FA0" stroke-width="1.2"/><path d="M 66.7 256.0 H 83.1 L 93.3 266.2 V 290.0 H 66.7 Z" fill="#FFFFFF" stroke="#6B4FA0" stroke-width="2" stroke-linejoin="round"/><path d="M 83.1 256.0 V 266.2 H 93.3 Z" fill="#6B4FA0" fill-opacity="0.28" stroke="#6B4FA0" stroke-width="1.4" stroke-linejoin="round"/><line x1="71.5" y1="273.7" x2="88.0" y2="273.7" stroke="#6B4FA0" stroke-width="1.6" stroke-opacity="0.5"/><line x1="71.5" y1="279.5" x2="88.0" y2="279.5" stroke="#6B4FA0" stroke-width="1.6" stroke-opacity="0.5"/><line x1="71.5" y1="285.2" x2="88.0" y2="285.2" stroke="#6B4FA0" stroke-width="1.6" stroke-opacity="0.5"/><text x="106" y="267" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#0F1B2A" text-anchor="start">geobrix-gdal-artifacts-v&lt;version&gt;-noble.tar.gz</text><text x="106" y="289" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#3F4D5E" text-anchor="start">The GDAL tarball (artifacts or platform: one, not both)</text><rect x="56" y="320" rx="9" ry="9" width="430" height="70" fill="#EDE8F5" stroke="#6B4FA0" stroke-width="1.2"/><path d="M 66.7 338.0 H 83.1 L 93.3 348.2 V 372.0 H 66.7 Z" fill="#FFFFFF" stroke="#6B4FA0" stroke-width="2" stroke-linejoin="round"/><path d="M 83.1 338.0 V 348.2 H 93.3 Z" fill="#6B4FA0" fill-opacity="0.28" stroke="#6B4FA0" stroke-width="1.4" stroke-linejoin="round"/><line x1="71.5" y1="355.7" x2="88.0" y2="355.7" stroke="#6B4FA0" stroke-width="1.6" stroke-opacity="0.5"/><line x1="71.5" y1="361.5" x2="88.0" y2="361.5" stroke="#6B4FA0" stroke-width="1.6" stroke-opacity="0.5"/><line x1="71.5" y1="367.2" x2="88.0" y2="367.2" stroke="#6B4FA0" stroke-width="1.6" stroke-opacity="0.5"/><text x="106" y="349" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#0F1B2A" text-anchor="start">geobrix-gdal-artifacts-v&lt;version&gt;-noble.tar.gz.sha256</text><text x="106" y="371" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#3F4D5E" text-anchor="start">Its sidecar: the hash the script verifies at start</text><rect x="56" y="402" rx="9" ry="9" width="430" height="70" fill="#EDE8F5" stroke="#6B4FA0" stroke-width="1.2"/><path d="M 66.7 420.0 H 83.1 L 93.3 430.2 V 454.0 H 66.7 Z" fill="#FFFFFF" stroke="#6B4FA0" stroke-width="2" stroke-linejoin="round"/><path d="M 83.1 420.0 V 430.2 H 93.3 Z" fill="#6B4FA0" fill-opacity="0.28" stroke="#6B4FA0" stroke-width="1.4" stroke-linejoin="round"/><line x1="71.5" y1="437.7" x2="88.0" y2="437.7" stroke="#6B4FA0" stroke-width="1.6" stroke-opacity="0.5"/><line x1="71.5" y1="443.5" x2="88.0" y2="443.5" stroke="#6B4FA0" stroke-width="1.6" stroke-opacity="0.5"/><line x1="71.5" y1="449.2" x2="88.0" y2="449.2" stroke="#6B4FA0" stroke-width="1.6" stroke-opacity="0.5"/><text x="106" y="431" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#0F1B2A" text-anchor="start">geobrix-&lt;version&gt;-jar-with-dependencies.jar</text><text x="106" y="453" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#3F4D5E" text-anchor="start">At most ONE JAR (used with the platform tarball)</text><text x="271.0" y="516" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#C2255C" text-anchor="middle">Nothing else: never a shared folder of artifacts</text><text x="560" y="142" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#7A8794" text-anchor="start" letter-spacing="1.4">2 · INIT SCRIPT AT CLUSTER START</text><rect x="556" y="150" rx="14" ry="14" width="420" height="386" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#card-shadow)"/><path d="M 556 164 A 14 14 0 0 1 570 150 H 962 A 14 14 0 0 1 976 164 V 155 H 556 Z" fill="#6B4FA0"/><rect x="576.0" y="172.0" rx="7" ry="7" width="92" height="64" fill="#EDE8F5" stroke="#6B4FA0" stroke-width="2"/><rect x="576.0" y="172.0" rx="7" ry="7" width="92" height="14" fill="#6B4FA0"/><rect x="576.0" y="180.0" width="92" height="6" fill="#6B4FA0"/><path d="M 590.0 200.0 L 602.0 209.0 L 590.0 218.0" fill="none" stroke="#6B4FA0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="608.0" y1="219.0" x2="628.0" y2="219.0" stroke="#6B4FA0" stroke-width="2.6" stroke-linecap="round"/><text x="682" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="800" fill="#0F1B2A" text-anchor="start">geobrix-gdal-init.sh</text><text x="682" y="220" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#3F4D5E" text-anchor="start">Versioned per release; edit VOL_DIR only</text><circle cx="592" cy="261" r="11" fill="#6B4FA0"/><text x="592" y="265" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="614" y="266" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#0F1B2A" text-anchor="start">Check the architecture is amd64 (fails fast on ARM)</text><circle cx="592" cy="303" r="11" fill="#6B4FA0"/><text x="592" y="307" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="614" y="308" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#0F1B2A" text-anchor="start">Verify the tarball against the .sha256 sidecar</text><circle cx="592" cy="345" r="11" fill="#6B4FA0"/><text x="592" y="349" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="614" y="350" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#0F1B2A" text-anchor="start">Extract and verify the SHA256SUMS manifest</text><circle cx="592" cy="387" r="11" fill="#6B4FA0"/><text x="592" y="391" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="614" y="392" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#0F1B2A" text-anchor="start">dpkg -i the bundled GDAL / PROJ / GEOS .debs</text><circle cx="592" cy="429" r="11" fill="#6B4FA0"/><text x="592" y="433" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="614" y="434" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#0F1B2A" text-anchor="start">pip install the bundled GDAL wheels (no PyPI)</text><circle cx="592" cy="471" r="11" fill="#6B4FA0"/><text x="592" y="475" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">6</text><text x="614" y="476" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#0F1B2A" text-anchor="start">Copy libgdalalljni.so and the JAR into place</text><text x="1060" y="142" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#7A8794" text-anchor="start" letter-spacing="1.4">3 · CLASSIC X86 CLUSTER</text><rect x="1056" y="150" rx="14" ry="14" width="388" height="386" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#card-shadow)"/><path d="M 1056 164 A 14 14 0 0 1 1070 150 H 1430 A 14 14 0 0 1 1444 164 V 155 H 1056 Z" fill="#6B4FA0"/><text x="1250.0" y="182" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="16" font-weight="800" fill="#0F1B2A" text-anchor="middle">Classic cluster</text><rect x="1228.0" y="202" rx="4" ry="4" width="44" height="22" fill="#6B4FA0" fill-opacity="0.9" stroke="#6B4FA0" stroke-width="2"/><rect x="1188.0" y="246" rx="4" ry="4" width="36" height="22" fill="#EDE8F5" stroke="#6B4FA0" stroke-width="2"/><line x1="1250.0" y1="224" x2="1206.0" y2="246" stroke="#6B4FA0" stroke-width="1.6" stroke-opacity="0.7"/><rect x="1232.0" y="246" rx="4" ry="4" width="36" height="22" fill="#EDE8F5" stroke="#6B4FA0" stroke-width="2"/><line x1="1250.0" y1="224" x2="1250.0" y2="246" stroke="#6B4FA0" stroke-width="1.6" stroke-opacity="0.7"/><rect x="1276.0" y="246" rx="4" ry="4" width="36" height="22" fill="#EDE8F5" stroke="#6B4FA0" stroke-width="2"/><line x1="1250.0" y1="224" x2="1294.0" y2="246" stroke="#6B4FA0" stroke-width="1.6" stroke-opacity="0.7"/><text x="1080" y="302" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#7A8794" text-anchor="start" letter-spacing="1.2">RUNTIME</text><text x="1080" y="321" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F1B2A" text-anchor="start">DBR 17.3 / 18 / 19 (Ubuntu 24.04)</text><text x="1080" y="354" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#7A8794" text-anchor="start" letter-spacing="1.2">INSTANCE TYPE</text><text x="1080" y="373" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F1B2A" text-anchor="start">Intel or AMD x86_64, not ARM</text><text x="1080" y="406" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#7A8794" text-anchor="start" letter-spacing="1.2">LIBRARY</text><text x="1080" y="425" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F1B2A" text-anchor="start">GeoBrix wheel as a cluster library</text><rect x="1080" y="488" rx="13" ry="13" width="96" height="26" fill="#FCE9E2"/><text x="1128.0" y="505.0" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#E04E2A">Heavyweight</text><text x="1420" y="506" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#7A8794" text-anchor="end" letter-spacing="1.2">TIER</text><line x1="512.0" y1="343.0" x2="541.0" y2="343.0" stroke="#6B4FA0" stroke-width="2.4" stroke-linecap="round"/><polygon points="550.0,343.0 541.0,348.0 541.0,338.0" fill="#6B4FA0"/><line x1="982.0" y1="343.0" x2="1041.0" y2="343.0" stroke="#6B4FA0" stroke-width="2.4" stroke-linecap="round"/><polygon points="1050.0,343.0 1041.0,348.0 1041.0,338.0" fill="#6B4FA0"/><rect x="36" y="554" rx="12" ry="12" width="1408" height="52" fill="#FADCE6" stroke="#C2255C" stroke-width="1.4"/><text x="56" y="576" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#C2255C" text-anchor="start" letter-spacing="1.0">WHY VOL_DIR STAYS ISOLATED</text><text x="56" y="595" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#0F1B2A" text-anchor="start">The script glob-copies every geobrix-*-jar-with-dependencies.jar it finds there: a mixed folder gives a nondeterministic classpath.</text>
