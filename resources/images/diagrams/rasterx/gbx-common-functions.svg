          orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L7,3 L0,6 Z" fill="#1F6FB5"/>
  </marker>
  <marker id="arrow-write" markerWidth="10" markerHeight="10" refX="7" refY="3"
