<text x="40" y="70" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="28" font-weight="800" fill="#0F1B2A" text-anchor="start">GeoBrix · GBX Common Functions</text>
<text x="40" y="96" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#3F4D5E" text-anchor="start">One shared file-access base under every lightweight reader and writer.</text>
