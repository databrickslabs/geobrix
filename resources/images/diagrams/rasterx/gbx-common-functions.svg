    <path d="M0,0 L7,3 L0,6 Z" fill="#7A5AA6"/>
  </marker>
  <marker id="arrow-fuse" markerWidth="10" markerHeight="10" refX="7" refY="3"
          orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L7,3 L0,6 Z" fill="#41546A"/>
  </marker>
</defs>

