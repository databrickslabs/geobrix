<text x="470" y="214" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F1B2A" text-anchor="start">The two boundaries</text>
<text x="470" y="240" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#3F4D5E" text-anchor="start" letter-spacing="0.8">FUSE vs FILE</text>
<text x="470" y="258" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#3F4D5E" text-anchor="start">DataSource readers/writers (spark.read.format / df.write.format) are</text>
<text x="470" y="274" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#3F4D5E" text-anchor="start">FUSE-only (session-less on Connect). FILE-tier access lives here, in</text>
<text x="470" y="290" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#3F4D5E" text-anchor="start">the function layer, where a SparkSession is present.</text>
<text x="470" y="312" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#3F4D5E" text-anchor="start" letter-spacing="0.8">Generic vs format-specific</text>
<text x="470" y="330" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#3F4D5E" text-anchor="start">gbx_file_read / gbx_file_write move path references. The format-specific</text>
<text x="470" y="346" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#3F4D5E" text-anchor="start">decoders/encoders (rst_fromfile, vector_file_read) understand the payload.</text>
<rect x="40" y="442" rx="18" ry="18" width="1320" height="236" fill="#ECE5F5" fill-opacity="0.35" stroke="#7A5AA6" stroke-width="1.5"/><rect x="40" y="442" rx="18" ry="18" width="10" height="236" fill="#7A5AA6"/><rect x="45" y="442" width="5" height="236" fill="#7A5AA6"/><rect x="62" y="418" rx="15" ry="15" width="158" height="30" fill="#7A5AA6"/><text x="141.0" y="437.0" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">FORMAT-SPECIFIC</text><text x="232" y="438" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#5A6878" text-anchor="start">rst_fromfile / vector_file_read / write_file_table  (decoders/encoders)</text>
