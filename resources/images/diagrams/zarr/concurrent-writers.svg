<text x="74" y="722" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1B3139" text-anchor="start">Each writer's rows are different rows, so Delta lands both</text><text x="74" y="738" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1B3139" text-anchor="start">with no retry and no wait. Different chunks never contend.</text>
