<text x="1024" y="722" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1B3139" text-anchor="start">The error names the keys and the winning write. B reads the</text><text x="1024" y="738" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1B3139" text-anchor="start">region again and writes again; GeoBrix never merges two</text><text x="1024" y="754" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1B3139" text-anchor="start">writers' cells silently.</text>
