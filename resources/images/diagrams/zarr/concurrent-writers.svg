<text x="549" y="722" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1B3139" text-anchor="start">B's data files are never rewritten. Up to 20 attempts, with</text><text x="549" y="738" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1B3139" text-anchor="start">a jittered wait capped at 16 s; each lost round means</text><text x="549" y="754" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1B3139" text-anchor="start">another writer landed.</text>
