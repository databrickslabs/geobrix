<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 800" width="1500" height="800" style="font-family: Inter, -apple-system, system-ui, sans-serif;"><defs><marker id="arrow-5A6878" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6878"/></marker><marker id="arrow-1F6FB5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB5"/></marker><marker id="arrow-7A5AA6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A5AA6"/></marker><marker id="arrow-2F8F4E" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F8F4E"/></marker><marker id="arrow-D2441F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D2441F"/></marker><marker id="arrow-0F8E8B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F8E8B"/></marker><marker id="arrow-B7791F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="arrow-1B3139" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B3139"/></marker><marker id="arrow-5A6878" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6878"/></marker><filter id="shadow" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0F1B2A" flood-opacity="0.08"/></filter><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAFBFC"/><stop offset="1" stop-color="#F1F4F8"/></linearGradient><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#D2441F" stroke-width="2" stroke-opacity="0.45"/></pattern></defs><rect width="1500" height="800" fill="url(#bg)"/>
<text x="40" y="60" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="28" font-weight="800" fill="#0F1B2A" text-anchor="start">A write is two phases</text><text x="40" y="88" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" font-weight="400" fill="#3F4D5E" text-anchor="start">Files first, invisible; then one atomic commit makes them a version</text>
<rect x="40" y="150" width="1420" height="108" rx="10" ry="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="40" y="150" width="8" height="108" rx="4" fill="#1B3139"/>
<text x="62" y="176" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="800" fill="#1B3139" text-anchor="start" letter-spacing="1.2">DRIVER</text>
<rect x="40" y="268" width="1420" height="108" rx="10" ry="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="40" y="268" width="8" height="108" rx="4" fill="#1F6FB5"/>
<text x="62" y="294" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="800" fill="#1F6FB5" text-anchor="start" letter-spacing="1.2">EXECUTOR TASKS</text>
<rect x="40" y="386" width="1420" height="108" rx="10" ry="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="40" y="386" width="8" height="108" rx="4" fill="#5A6878"/>
<text x="62" y="412" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="800" fill="#5A6878" text-anchor="start" letter-spacing="1.2">VOLUME</text>
<rect x="40" y="504" width="1420" height="108" rx="10" ry="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<rect x="40" y="504" width="8" height="108" rx="4" fill="#7A5AA6"/>
<text x="62" y="530" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="800" fill="#7A5AA6" text-anchor="start" letter-spacing="1.2">MANIFEST (DELTA)</text>
<rect x="210" y="112" width="684" height="28" rx="8" fill="#E3EEF8"/>
<text x="555.0" y="131" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="800" fill="#1F6FB5" text-anchor="middle" letter-spacing="0.8">PHASE 1 · FILES (distributed, nothing visible yet)</text>
<rect x="906" y="112" width="554" height="28" rx="8" fill="#DCEFE0"/>
<text x="1183.0" y="131" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="800" fill="#2F8F4E" text-anchor="middle" letter-spacing="0.8">PHASE 2 · COMMIT (driver, atomic)</text>
<line x1="900" y1="108" x2="900" y2="608" stroke="#2F8F4E" stroke-width="2.4" stroke-dasharray="7 5"/>
<rect x="230" y="168" width="330" height="88" rx="9" ry="9" fill="#EEF1F5" stroke="#1B3139" stroke-width="1.6"/><circle cx="232" cy="170" r="13" fill="#1B3139"/><text x="232" y="175" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">1</text><text x="252" y="192" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="800" fill="#1B3139" text-anchor="start">Plan against a base version</text><text x="244" y="212" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1B3139" text-anchor="start">Read the manifest at version V. Group the input</text><text x="244" y="227" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1B3139" text-anchor="start">by target shard and pick a write_id (32 hex</text><text x="244" y="242" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1B3139" text-anchor="start">characters).</text>
<rect x="230" y="286" width="330" height="88" rx="9" ry="9" fill="#E3EEF8" stroke="#1F6FB5" stroke-width="1.6"/><circle cx="232" cy="288" r="13" fill="#1F6FB5"/><text x="232" y="293" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">2</text><text x="252" y="310" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="800" fill="#1F6FB5" text-anchor="start">Encode the chunks</text><text x="244" y="330" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1B3139" text-anchor="start">Fully covered chunks are encoded fresh. Partly</text><text x="244" y="345" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1B3139" text-anchor="start">covered ones are read at V, patched and</text><text x="244" y="360" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1B3139" text-anchor="start">re-encoded.</text>
<rect x="590" y="404" width="290" height="88" rx="9" ry="9" fill="#EEF1F5" stroke="#5A6878" stroke-width="1.6"/><circle cx="592" cy="406" r="13" fill="#5A6878"/><text x="592" y="411" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">3</text><text x="612" y="428" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="800" fill="#5A6878" text-anchor="start">One pack per array and task</text><text x="604" y="448" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1B3139" text-anchor="start">data/&lt;array&gt;/&lt;write_id&gt;/part-*.zpack,</text><text x="604" y="463" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1B3139" text-anchor="start">written once, sequentially, never modified</text><text x="604" y="478" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1B3139" text-anchor="start">again.</text>
<rect x="590" y="286" width="290" height="88" rx="9" ry="9" fill="#E3EEF8" stroke="#1F6FB5" stroke-width="1.6"/><circle cx="592" cy="288" r="13" fill="#1F6FB5"/><text x="592" y="293" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">4</text><text x="612" y="310" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="800" fill="#1F6FB5" text-anchor="start">Return small rows</text><text x="604" y="330" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1B3139" text-anchor="start">A small row for each chunk: file, offset,</text><text x="604" y="345" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1B3139" text-anchor="start">length, checksum.</text>
<rect x="956" y="168" width="320" height="88" rx="9" ry="9" fill="#EEF1F5" stroke="#1B3139" stroke-width="1.6"/><circle cx="958" cy="170" r="13" fill="#1B3139"/><text x="958" y="175" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">5</text><text x="978" y="192" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="800" fill="#1B3139" text-anchor="start">Collect the rows</text><text x="970" y="212" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1B3139" text-anchor="start">The driver holds the manifest rows of the whole</text><text x="970" y="227" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1B3139" text-anchor="start">write.</text>
<rect x="924" y="512" width="380" height="100" rx="9" ry="9" fill="#ECE5F5" stroke="#7A5AA6" stroke-width="1.6"/><circle cx="926" cy="514" r="13" fill="#7A5AA6"/><text x="926" y="519" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">6</text><text x="946" y="536" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="800" fill="#7A5AA6" text-anchor="start">One Delta MERGE</text><text x="938" y="556" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1B3139" text-anchor="start">Chunk rows with a compare-and-swap on each replaced key's</text><text x="938" y="571" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1B3139" text-anchor="start">write_id (and “still absent” for new keys), the changed</text><text x="938" y="586" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1B3139" text-anchor="start">array and coordinate rows, and a commit row keyed by</text><text x="938" y="601" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1B3139" text-anchor="start">write_id.</text>
<rect x="1324" y="512" width="136" height="100" rx="9" ry="9" fill="#DCEFE0" stroke="#2F8F4E" stroke-width="1.6"/><circle cx="1326" cy="514" r="13" fill="#2F8F4E"/><text x="1326" y="519" text-anchor="middle" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">7</text><text x="1346" y="536" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="800" fill="#2F8F4E" text-anchor="start">Version V+1</text><text x="1338" y="556" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#1B3139" text-anchor="start">Visible whole.</text>
<path d="M 395 256 V 284" fill="none" stroke="#5A6878" stroke-width="2" marker-end="url(#arrow-5A6878)"/>
<path d="M 560 330 C 575 330, 565 448, 588 448" fill="none" stroke="#1F6FB5" stroke-width="2" marker-end="url(#arrow-1F6FB5)"/>
<path d="M 735 404 V 376" fill="none" stroke="#1F6FB5" stroke-width="2" marker-end="url(#arrow-1F6FB5)"/>
<path d="M 880 330 C 970 330, 970 212, 954 212" fill="none" stroke="#1F6FB5" stroke-width="2" marker-end="url(#arrow-1F6FB5)"/>
<path d="M 1100 256 C 1100 368, 1110 422, 1110 510" fill="none" stroke="#7A5AA6" stroke-width="2" marker-end="url(#arrow-7A5AA6)"/>
<path d="M 1304 562 H 1322" fill="none" stroke="#2F8F4E" stroke-width="3" marker-end="url(#arrow-2F8F4E)"/>
<rect x="210" y="628" width="640" height="74" rx="9" ry="9" fill="#FCE9E2" stroke="#D2441F" stroke-width="1.4"/>
<text x="226" y="654" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="800" fill="#D2441F" text-anchor="start">If anything fails before the MERGE</text>
<text x="226" y="674" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1B3139" text-anchor="start">No row was written, so nothing is visible and the version has not moved. The packs are</text><text x="226" y="690" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1B3139" text-anchor="start">unreferenced and the next vacuum removes them.</text>
<rect x="870" y="628" width="590" height="74" rx="9" ry="9" fill="#DCEFE0" stroke="#2F8F4E" stroke-width="1.4"/>
<text x="886" y="654" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="13" font-weight="800" fill="#2F8F4E" text-anchor="start">Run it again with the same write_id</text>
<text x="886" y="674" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1B3139" text-anchor="start">If that write already committed, the call returns its version and writes nothing, so a</text><text x="886" y="690" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="12" font-weight="400" fill="#1B3139" text-anchor="start">retried job cannot apply a write twice.</text>
<text x="1460" y="778" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="400" fill="#7A8794" text-anchor="end">GeoBrix · Zarr stores</text>
</svg>