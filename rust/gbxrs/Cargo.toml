[package]
name = "gbxrs"
version = "0.6.0"
edition = "2021"
license = "LicenseRef-Databricks-Proprietary"
publish = false

[lib]
name = "_gbxrs"
crate-type = ["cdylib"]

# `gdal`: the GDAL decode kernel (`decode_window`), linked to the payload's libgdal (never a bundled one: deny.toml).
# gdal-sys 0.12.0 ships prebuilt bindings up to GDAL 3.12 only, so they are generated from the payload's 3.13 headers
# (`bindgen`); build it with `gbx:build:native --target rust-native` (scripts/native/build-rust-native.sh), not with a
# bare `cargo build --features gdal`. The default build (the shipped module without GDAL) needs none of this.
[features]
gdal = ["dep:gdal-sys"]

[dependencies]
pyo3 = { version = "=0.30.1", features = ["extension-module", "abi3-py312"] }
gdal-sys = { version = "=0.12.0", optional = true, default-features = false, features = ["bindgen"] }

[profile.release]
lto = "thin"
codegen-units = 1
