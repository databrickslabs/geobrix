# Native stack pins: the one place GeoBrix pins GDAL, PROJ, GEOS, their dependencies, the Rust toolchain and the bindings.
# KEY=VALUE, no spaces around '='; a value is quoted only when it holds spaces. Read by bash (source) and by scripts/native/pins.py.
# Per dependency X: X_VERSION, X_URL, X_URL2 (a second download of the SAME file, or 'single-source'), X_FILE, X_SHA256, X_LICENSE.
# X_SHA256 is identical from X_URL and X_URL2 where a second origin exists (16 of 36 sources). The 20 marked
# X_URL2=single-source have one origin; their sum was checked against the project's published checksum, the
# release-asset digest GitHub records, or an independent Homebrew record instead. The PROJ grids (PROJGRID_*) are
# files, not releases: they have no X_VERSION.
# Never put a mirror or proxy host in this file: internal hosts belong in the untracked .gbx-local.env.
# Its KEY=VALUE lines are the cache key of the GDAL build (the image tag and the deps stage hash them, comments and
# blank lines dropped): a value changed here rebuilds GDAL and re-hashes every SONAME. Pins that feed no GDAL build
# (the Rust crates, PyO3, the rust-native stage's libclang) go in rust-pins.conf instead.

GBX_NATIVE_REVISION=1
JDK_MAJOR=17
PYTHON_VERSION=3.12.3
NUMPY_BUILD_VERSION=2.1.3

