# Pins that feed no GDAL build: the PyO3 and georust crates of every GeoBrix Rust crate, the libclang of the
# rust-native build stage, and the checksum of the GDAL Java classes the pom installs. Same KEY=VALUE form as
# pins.conf and read by the same parser (scripts/native/pins.py: `get`, `validate`, `audit`). Kept out of pins.conf on
# purpose: every KEY=VALUE line there is part of the GDAL build's cache key, so a crate bump there would rebuild GDAL
# and re-hash every SONAME. Nothing here is a build arg of a stage GDAL is built in; only the rust-native stage takes
# CLANG_LIBS_VERSION.
# Never put a mirror or proxy host in this file: internal hosts belong in the untracked .gbx-local.env.

# The PyO3 every GeoBrix crate uses (exact, `=<version>` in each Cargo.toml; `pins.py audit` checks every form).
PYO3_VERSION=0.30.1

# --- Rust crates that call the native stack (georust): CRATE_<name>_VERSION, the crate name upper-cased, '-' as '_'.
# They link the payload's GDAL, PROJ and GEOS through the dev kit (gbx:build:native --target rust-native), never a
# crate's own bundled build (deny.toml bans gdal-src, geos-src and the bundled features). The checksums are in each
# Cargo.lock; `pins.py audit` fails when a Cargo.lock locks another version, or when no Cargo.lock locks a pinned
# crate (a stale pin). Licences (cargo-deny checks them): gdal-sys, geos, geos-sys MIT; proj, proj-sys MIT OR
# Apache-2.0. gdal-sys 0.12.0 ships prebuilt bindings up to GDAL 3.12 only, so it is built with its `bindgen`
# feature against the payload's 3.13 headers. The high-level `gdal` crate is not pinned: its latest release (0.19.0)
# does not compile against GDAL 3.13 (GDT_Byte became GDT_UInt8, GDALRasterIOExtraArg gained bOperateInBufType); pin
# it here once a release supports 3.13.
CRATE_GDAL_SYS_VERSION=0.12.0
CRATE_GEOS_VERSION=11.3.1
CRATE_GEOS_SYS_VERSION=2.0.10
CRATE_PROJ_VERSION=0.31.0
CRATE_PROJ_SYS_VERSION=0.27.0

# --- The rust-native stage: libclang for bindgen, from the AlmaLinux 8.10 AppStream llvm-toolset module (the same
# VERSION-RELEASE on both architectures). clang-libs and llvm-libs are installed at exactly this VERSION-RELEASE and
# checked with rpm -q. When the distribution archives it, the image build fails: a bump is then a reviewed change.
# It also pulls in gcc-toolset-15 (clang-libs requires it); PATH keeps the manylinux gcc-toolset-14.
CLANG_LIBS_VERSION=21.1.8-1.module_el8.10.0+4172+b6b13d75

# --- Not Rust: GDAL's Java classes, from the native build that makes the JNI (this file holds every pin that feeds no
# GDAL build; the name predates this one). The jar is scripts/native/maven/gdal-<GDAL_VERSION>-gbx<GBX_NATIVE_REVISION>.jar,
# the Maven artifact org.gdal:gdal:<GDAL_VERSION>-gbx<GBX_NATIVE_REVISION> the JAR bundles.
#   python3 scripts/native/java_jar.py stage      writes it from both architectures' build and prints this sum
#   python3 scripts/native/java_jar.py install    puts it into a local Maven repository, refusing it unless its sha256
#                                                 is this pin; run once per checkout and after every bump or re-stage
# `pins.py audit` checks the committed jar against this sum and the GDAL it records against pins.conf. A build output,
# not an input: in pins.conf it would be part of its own build's cache key.
GDAL_JAVA_JAR_SHA256=17416efc7f12c47febaa21c50b22ee62d116f1f6102b046fc59607238093dc08
