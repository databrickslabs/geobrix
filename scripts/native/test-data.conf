# Test data that a binding's sdist does not ship, for the bindings probe (scripts/native/test-bindings.sh).
# KEY=VALUE, read by prefetch.sh; not part of pins.conf because it feeds no build and must not change the toolchain image tag.
# rasterio's sdist has no tests/data since 0.12 (its conftest says "Test data is not distributed with sdists"): the data
# is taken from the project's tag archive, and only tests/data of it. GitHub does not promise a tag archive stays
# byte-identical (the same note as the CBLOSC, LERC and OPENJPEG pins): a changed sum fails the pre-fetch.
# RASTERIO_TESTDATA_VERSION must equal RASTERIO_VERSION in pins.conf; move both together.
RASTERIO_TESTDATA_VERSION=1.5.2
RASTERIO_TESTDATA_URL=https://github.com/rasterio/rasterio/archive/refs/tags/1.5.2.tar.gz
RASTERIO_TESTDATA_SHA256=a3342f6a5102d8bb07d831b2390e217a2fd84afc49efbfe3e7cf36801de99c63
